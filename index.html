<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Educa Typique</title>
<meta name="description" content="Educa Typique — neuropédagogie et accompagnement des familles neuro-atypiques.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f2ea">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Nunito:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --fond:#f6f2ea;
    --carte:#ffffff;
    --encre:#3b3346;
    --encre-doux:#6f6780;
    --trait:#e8e0d4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--fond);
    color:var(--encre);
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    line-height:1.6;
  }
  main{
    background:var(--carte);
    border:1px solid var(--trait);
    border-radius:22px;
    padding:48px 40px;
    max-width:520px;
    width:100%;
    text-align:center;
    box-shadow:0 18px 50px rgba(59,51,70,.06);
  }
  h1{
    font-family:"Poppins",system-ui,sans-serif;
    font-weight:600;
    font-size:clamp(28px,6vw,38px);
    letter-spacing:.01em;
  }
  .sous{
    color:var(--encre-doux);
    font-size:15px;
    margin-top:10px;
  }
  hr{
    border:0;
    border-top:1px solid var(--trait);
    margin:28px 0;
  }
  p.note{
    color:var(--encre-doux);
    font-size:14px;
  }
  footer{
    margin-top:26px;
    color:var(--encre-doux);
    font-size:12.5px;
  }
  @media (max-width:520px){
    main{padding:36px 24px;border-radius:18px}
  }
</style>
</head>
<body>
<main>
  <h1>Educa Typique</h1>
  <p class="sous">Neuropédagogie &amp; accompagnement des familles neuro-atypiques</p>
  <hr>
  <p class="note">Les espaces de ce site sont accessibles par lien direct.</p>
  <footer>Nawel Haddouch</footer>
</main>
<script>
  /* Désinstalle l'ancien service worker (cache hors-ligne) laissé sur les
     appareils qui avaient ouvert l'application, et vide ses caches. */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) {
        var reste = r.scope.split("/boussole-ado-educa-typique/")[1];
        if (reste === "") r.unregister();
      });
    });
  }
  if (window.caches && caches.keys) {
    caches.keys().then(function (cles) {
      cles.forEach(function (c) { if (c.indexOf("cap-educa") === 0) caches.delete(c); });
    });
  }
</script>
</body>
</html>
