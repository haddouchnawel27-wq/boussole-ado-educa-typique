<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Al Mizan — un compagnon du quotidien pour retrouver ton équilibre et avancer avec sérénité : check-in, tendances, recommandations, journal des pensées. 100% local et privé." />
  <meta name="theme-color" content="#8a9882" />
  <title>Al Mizan — Équilibre intérieur, clarté & sérénité</title>
  <link rel="icon" href="assets/img/al-mizan-icon.svg" />
  <link rel="apple-touch-icon" href="assets/img/al-mizan-icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <header class="topbar">
    <a href="#/accueil" class="brand" aria-label="Accueil Al Mizan">
      <img class="brand-logo" src="assets/img/al-mizan-mark.svg" alt="" width="36" height="36" />
      <span class="brand-name">Al Mizan</span>
    </a>
    <button id="btn-crise" class="btn crise mini" type="button">Respirer</button>
  </header>

  <nav id="onglets" class="onglets" aria-label="Navigation principale"></nav>

  <main id="contenu" class="content" tabindex="-1">
    <section id="vue" class="vue" aria-live="polite"></section>
    <footer class="pied">
      <p>🔒 Tes données restent sur cet appareil. Aucun compte, aucun serveur.</p>
      <p class="disclaimer">Outil de soutien à la compréhension de soi — ne remplace ni un diagnostic, ni un suivi médical ou psychologique.</p>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal-root"></div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById("btn-crise").addEventListener("click", function () { AlMizan.crise(); });
    AlMizan.start();
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
