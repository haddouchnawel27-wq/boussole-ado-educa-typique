<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="42%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#F6EFE2"/>
      <stop offset="60%" stop-color="#F1E8D8"/>
      <stop offset="100%" stop-color="#EBE0CE"/>
    </radialGradient>
    <radialGradient id="gold" cx="36%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#EBD892"/>
      <stop offset="48%" stop-color="#D8BC64"/>
      <stop offset="100%" stop-color="#C2963A"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="118" ry="118" fill="url(#bg)"/>

  <!-- balance beam -->
  <g stroke="#B3A48F" stroke-width="6.5" stroke-linecap="round" fill="none">
    <line x1="150" y1="196" x2="362" y2="196"/>
  </g>
  <circle cx="150" cy="196" r="7.5" fill="#B3A48F"/>
  <circle cx="362" cy="196" r="7.5" fill="#B3A48F"/>
  <!-- central post -->
  <line x1="256" y1="196" x2="256" y2="252" stroke="#B3A48F" stroke-width="5.5" stroke-linecap="round"/>

  <!-- left pan : sage fan -->
  <g stroke-linecap="round" fill="none" stroke-width="8">
    <path d="M150 200 L112 244" stroke="#A7BBA0"/>
    <path d="M150 200 L134 250" stroke="#8FA98D"/>
    <path d="M150 200 L158 252" stroke="#7E9A7C"/>
    <path d="M150 200 L184 244" stroke="#9BB295"/>
  </g>

  <!-- right pan : terracotta fan -->
  <g stroke-linecap="round" fill="none" stroke-width="8">
    <path d="M362 200 L328 244" stroke="#D8A192"/>
    <path d="M362 200 L354 252" stroke="#C98A79"/>
    <path d="M362 200 L378 250" stroke="#BE7C6A"/>
    <path d="M362 200 L400 244" stroke="#D2988A"/>
  </g>

  <!-- gold weight on top -->
  <circle cx="256" cy="150" r="42" fill="url(#gold)"/>
  <ellipse cx="244" cy="138" rx="15" ry="11" fill="#F1E3AC" opacity="0.55"/>

  <!-- gentle smile -->
  <path d="M198 322 Q256 372 314 322" fill="none" stroke="#B3A48F" stroke-width="8.5" stroke-linecap="round"/>
</svg>
