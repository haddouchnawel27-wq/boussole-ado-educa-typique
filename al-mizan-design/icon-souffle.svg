<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sbg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#9EAD98"/>
      <stop offset="58%" stop-color="#8C9C87"/>
      <stop offset="100%" stop-color="#78896F"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBEFC2" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#F0D98C" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#E7C86E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E7C86E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="42%" cy="38%" r="66%">
      <stop offset="0%" stop-color="#FDF6D8"/>
      <stop offset="42%" stop-color="#F3DE97"/>
      <stop offset="100%" stop-color="#E1BE5E"/>
    </radialGradient>
    <linearGradient id="ledge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFE6CC"/>
      <stop offset="100%" stop-color="#CFC29B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="118" ry="118" fill="url(#sbg)"/>

  <!-- arch / niche outline -->
  <path d="M158 384 L158 232 A98 98 0 0 1 354 232 L354 384"
        fill="none" stroke="#E9DFC3" stroke-width="6" stroke-linecap="round" opacity="0.92"/>
  <path d="M176 384 L176 234 A80 80 0 0 1 336 234 L336 384"
        fill="none" stroke="#E9DFC3" stroke-width="2.4" stroke-linecap="round" opacity="0.5"/>
  <!-- little finial on top -->
  <circle cx="256" cy="132" r="6.5" fill="#EFE7CD"/>

  <!-- glow halo -->
  <circle cx="256" cy="300" r="120" fill="url(#glow)"/>
  <!-- luminous orb -->
  <circle cx="256" cy="300" r="52" fill="url(#orb)"/>
  <ellipse cx="240" cy="284" rx="16" ry="12" fill="#FEFBEC" opacity="0.6"/>

  <!-- base ledge -->
  <rect x="140" y="380" width="232" height="17" rx="8.5" fill="url(#ledge)"/>
  <rect x="150" y="373" width="212" height="9" rx="4.5" fill="#F1E8CE" opacity="0.85"/>
</svg>
