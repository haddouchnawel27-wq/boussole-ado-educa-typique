document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

and-deep:   #DACDBC; /* borders on cream, dividers */\n  --taupe:       #B9ADA0; /* Taupe — arch fill, muted decorative */\n\n  /* ——— Sauge (foliage) ——— */\n  --sage-soft:   #C0CBB9;\n  --sage:        #8A9789;  /* Sauge — charter */\n  --sage-deep:   #677465;\n  --sage-ink:    #4A554A;\n\n  /* ——— Rose Argile (the winding path) ——— */\n  --clay-soft:   #E2BEB2;\n  --clay:        #C88E7F;  /* Rose Argile — charter */\n  --clay-deep:   #A96B5B;\n\n  /* ——— Or Champagne (the sun, ornaments) ——— */\n  --gold-soft:   #E6CF9C;\n  --gold:        #D8B77A;  /* Or Champagne — charter */\n  --gold-deep:   #B8954F;\n\n  /* ——— Cacao (warm browns) ——— */\n  --ink:         #3B2B23; /* Cacao — primary text */\n  --ink-soft:    #5E4D42; /* secondary text */\n  --ink-muted:   #8C7C70; /* tertiary / captions */\n  --ink-faint:   #B3A89B; /* placeholders, disabled */\n\n  /* ——— Semantic aliases ——— */\n  --bg-page:        var(--ivory);\n  --bg-section:     var(--cream);\n  --bg-section-alt: var(--sand);\n  --surface-card:   var(--cream);\n  --surface-well:   var(--sand);\n\n  --text-heading:   var(--ink);\n  --text-body:      var(--ink-soft);\n  --text-muted:     var(--ink-muted);\n  --text-on-accent: var(--cream);\n  --text-link:      var(--clay-deep);\n\n  --border-subtle:  var(--sand-deep);\n  --border-strong:  var(--taupe);\n  --border-accent:  var(--gold);\n\n  --accent:         var(--clay);       /* primary action / brand warm */\n  --accent-deep:    var(--clay-deep);\n  --accent-cool:    var(--sage-deep);  /* secondary / calm actions */\n  --accent-gold:    var(--gold);       /* ornaments, highlights */\n\n  --focus-ring:     color-mix(in oklab, var(--gold) 55%, transparent);\n}\n<\u002Fstyle>\n  <style>/* Jannat al Qulûb — Typography tokens */\n:root {\n  --font-display: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;\n  --font-sans:    'Jost', 'Century Gothic', 'Segoe UI', system-ui, sans-serif;\n\n  /* Body uses the sans for clarity; display serif for headings & quotes. */\n  --font-body:    var(--font-sans);\n  --font-heading: var(--font-display);\n\n  /* ——— Type scale (fluid-friendly, rem) ——— */\n  --text-xs:   0.75rem;   /* 12px — micro labels */\n  --text-sm:   0.875rem;  /* 14px — captions, fine print */\n  --text-base: 1rem;      /* 16px — body */\n  --text-md:   1.125rem;  /* 18px — lead body */\n  --text-lg:   1.5rem;    /* 24px — small headings */\n  --text-xl:   2rem;      /* 32px — section headings */\n  --text-2xl:  2.75rem;   /* 44px — page headings */\n  --text-3xl:  4rem;      /* 64px — hero wordmark */\n  --text-4xl:  5.5rem;    /* 88px — display */\n\n  /* ——— Weights ——— */\n  --weight-light:    300;\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* ——— Line heights ——— */\n  --leading-tight:   1.1;\n  --leading-snug:    1.25;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.7;\n\n  /* ——— Tracking ——— */\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.08em;  /* labels */\n  --tracking-wider:  0.18em;  /* eyebrow / subtitle caps */\n}\n<\u002Fstyle>\n  <style>/* Jannat al Qulûb — Spacing & layout tokens\n   Generous, airy rhythm on an 8px base. The brand breathes — lots of whitespace. */\n:root {\n  --space-0:   0;\n  --space-1:   0.25rem;  /* 4 */\n  --space-2:   0.5rem;   /* 8 */\n  --space-3:   0.75rem;  /* 12 */\n  --space-4:   1rem;     /* 16 */\n  --space-5:   1.5rem;   /* 24 */\n  --space-6:   2rem;     /* 32 */\n  --space-7:   3rem;     /* 48 */\n  --space-8:   4rem;     /* 64 */\n  --space-9:   6rem;     /* 96 */\n  --space-10:  8rem;     /* 128 — section padding */\n\n  --container:      1120px;  /* max content width */\n  --container-tight: 720px;  /* prose / forms */\n  --gutter:         var(--space-6);\n  --section-y:      var(--space-10);\n}\n<\u002Fstyle>\n  <style>/* Jannat al Qulûb — Effects: radii, borders, shadows, motion\n   Soft, gentle, organic. Generous rounding, whisper-soft warm shadows. */\n:root {\n  /* ——— Radii ——— */\n  --radius-sm:   8px;\n  --radius-md:   14px;\n  --radius-lg:   22px;\n  --radius-xl:   32px;\n  --radius-pill: 999px;\n  --radius-arch: 999px 999px 0 0; /* the mihrab arch motif */\n\n  /* ——— Borders ——— */\n  --border-hair:  1px solid var(--border-subtle);\n  --border-soft:  1px solid var(--border-strong);\n  --border-gold:  1px solid var(--gold-soft);\n\n  /* ——— Shadows (warm-toned, never grey) ——— */\n  --shadow-xs:  0 1px 2px rgba(64, 56, 49, 0.05);\n  --shadow-sm:  0 2px 8px rgba(64, 56, 49, 0.06);\n  --shadow-md:  0 8px 24px rgba(64, 56, 49, 0.08);\n  --shadow-lg:  0 18px 48px rgba(64, 56, 49, 0.10);\n  --shadow-gold: 0 6px 20px rgba(162, 132, 58, 0.16);\n\n  /* ——— Motion: calm, never bouncy ——— */\n  --ease-soft:   cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-inout:  cubic-bezier(0.45, 0, 0.55, 1);    /* @kind other */\n  --dur-fast:    160ms; /* @kind other */\n  --dur-base:    260ms; /* @kind other */\n  --dur-slow:    420ms; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* Jannat al Qulûb — Base element styles (opt-in via .jaq-prose / global resets) */\n:root {\n  color-scheme: light;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg-page);\n  color: var(--text-body);\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  font-weight: var(--weight-regular);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-heading);\n  color: var(--text-heading);\n  font-weight: var(--weight-medium);\n  line-height: var(--leading-tight);\n  margin: 0;\n}\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 3px; }\n\n::selection { background: var(--gold-soft); color: var(--ink); }\n\n:where(button, [role=\"button\"], input, select, textarea):focus-visible {\n  outline: 3px solid var(--focus-ring);\n  outline-offset: 2px;\n}\n\n/* ——— Component interaction states (hover/press) ——— */\n.jaq-btn:hover { transform: translateY(-1px); }\n.jaq-btn:active { transform: translateY(0) scale(0.985); }\n.jaq-btn--primary:hover { background: var(--accent-deep); }\n.jaq-btn--gold:hover { background: var(--gold-deep); color: var(--cream); }\n.jaq-btn--secondary:hover { background: color-mix(in oklab, var(--sage-deep) 8%, transparent); }\n.jaq-btn--ghost:hover { background: var(--surface-well); }\n\n.jaq-card--interactive { transition: transform var(--dur-base) var(--ease-soft), box-shadow var(--dur-base) var(--ease-soft); }\n.jaq-card--interactive:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }\n\n.jaq-input:focus { border-color: var(--gold); background: var(--cream); }\n.jaq-accordion__head { transition: color var(--dur-base) var(--ease-soft); }\n.jaq-accordion__head:hover { color: var(--accent-deep); }\n\n/* Eyebrow / subtitle treatment — the brand's letterspaced caps label */\n.jaq-eyebrow {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-light);\n  font-size: var(--text-sm);\n  letter-spacing: var(--tracking-wider);\n  text-transform: uppercase;\n  color: var(--ink-muted);\n}\n<\u002Fstyle>\n  <style>/* Jannat al Qulûb — Design System\n   Global entry point. Consumers link this single file.\n   Keep this an @import manifest only — no rules here. */\n/* Jannat al Qulûb — Webfonts\n   Brand wordmark is a refined high-contrast serif → Cormorant Garamond.\n   Subtitle / UI labels are a light, widely-tracked geometric sans → Jost.\n   NOTE: substituted from Google Fonts (originals not provided). See readme. */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Cormorant Garamond';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"bae4c883-d845-4eec-8f91-bcc036f4da22\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  fo 30-0ef055df0d00\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4ffc3d0e-18e5-4282-821f-ec3221aadbf0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Jannat al Qulûb — Color tokens\n   Aligned to the official brand charter (charte visuelle):\n   Sauge #8A9789 · Amande #E8DDD1 · Ivoire #F6F2EA · Rose Argile #C88E7F\n   · Taupe #B9ADA0 · Cacao #3B2B23 · Or Champagne #D8B77A */\n:root {\n  /* ——— Base: warm neutrals (paper & sand) ——— */\n  --ivory:       #F6F2EA; /* Ivoire — page ground */\n  --cream:       #FCFAF4; /* raised cards / surfaces (lightest paper) */\n  --sand:        #E8DDD1; /* Amande — subtle fills, wells */\n  --sand-deep:   #DACDBC; /* borders on cream, dividers */\n  --taupe:       #B9ADA0; /* Taupe — arch fill, muted decorative */\n\n  /* ——— Sauge (foliage) ——— */\n  --sage-soft:   #C0CBB9;\n  --sage:        #8A9789;  /* Sauge — charter */\n  --sage-deep:   #677465;\n  --sage-ink:    #4A554A;\n\n  /* ——— Rose Argile (the winding path) ——— */\n  --clay-soft:   #E2BEB2;\n  --clay:        #C88E7F;  /* Rose Argile — charter */\n  --clay-deep:   #A96B5B;\n\n  /* ——— Or Champagne (the sun, ornaments) ——— */\n  --gold-soft:   #E6CF9C;\n  --gold:        #D8B77A;  /* Or Champagne — charter */\n  --gold-deep:   #B8954F;\n\n  /* ——— Cacao (warm browns) ——— */\n  --ink:         #3B2B23; /* Cacao — primary text */\n  --ink-soft:    #5E4D42; /* secondary text */\n  --ink-muted:   #8C7C70; /* tertiary / captions */\n  --ink-faint:   #B3A89B; /* placeholders, disabled */\n\n  /* ——— Semantic aliases ——— */\n  --bg-page:        var(--ivory);\n  --bg-section:     var(--cream);\n  --bg-section-alt: var(--sand);\n  --surface-card:   var(--cream);\n  --surface-well:   var(--sand);\n\n  --text-heading:   var(--ink);\n  --text-body:      var(--ink-soft);\n  --text-muted:     var(--ink-muted);\n  --text-on-accent: var(--cream);\n  --text-link:      var(--clay-deep);\n\n  --border-subtle:  var(--sand-deep);\n  --border-strong:  var(--taupe);\n  --border-accent:  var(--gold);\n\n  --accent:         var(--clay);       /* primary action / brand warm */\n  --accent-deep:    var(--clay-deep);\n  --accent-cool:    var(--sage-deep);  /* secondary / calm actions */\n  --accent-gold:    var(--gold);       /* ornaments, highlights */\n\n  --focus-ring:     color-mix(in oklab, var(--gold) 55%, transparent);\n}\n\n/* Jannat al Qulûb — Typography tokens */\n:root {\n  --font-display: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;\n  --font-sans:    'Jost', 'Century Gothic', 'Segoe UI', system-ui, sans-serif;\n\n  /* Body uses the sans for clarity; display serif for headings & quotes. */\n  --font-body:    var(--font-sans);\n  --font-heading: var(--font-display);\n\n  /* ——— Type scale (fluid-friendly, rem) ——— */\n  --text-xs:   0.75rem;   /* 12px — micro labels */\n  --text-sm:   0.875rem;  /* 14px — captions, fine print */\n  --text-base: 1rem;      /* 16px — body */\n  --text-md:   1.125rem;  /* 18px — lead body */\n  --text-lg:   1.5rem;    /* 24px — small headings */\n  --text-xl:   2rem;      /* 32px — section headings */\n  --text-2xl:  2.75rem;   /* 44px — page headings */\n  --text-3xl:  4rem;      /* 64px — hero wordmark */\n  --text-4xl:  5.5rem;    /* 88px — display */\n\n  /* ——— Weights ——— */\n  --weight-light:    300;\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* ——— Line heights ——— */\n  --leading-tight:   1.1;\n  --leading-snug:    1.25;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.7;\n\n  /* ——— Tracking ——— */\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.08em;  /* labels */\n  --tracking-wider:  0.18em;  /* eyebrow / subtitle caps */\n}\n\n/* Jannat al Qulûb — Spacing & layout tokens\n   Generous, airy rhythm on an 8px base. The brand breathes — lots of whitespace. */\n:root {\n  --space-0:   0;\n  --space-1:   0.25rem;  /* 4 */\n  --space-2:   0.5rem;   /* 8 */\n  --space-3:   0.75rem;  /* 12 */\n  --space-4:   1rem;     /* 16 */\n  --space-5:   1.5rem;   /* 24 */\n  --space-6:   2rem;     /* 32 */\n  --space-7:   3rem;     /* 48 */\n  --space-8:   4rem;     /* 64 */\n  --space-9:   6rem;     /* 96 */\n  --space-10:  8rem;     /* 128 — section padding */\n\n  --container:      1120px;  /* max content width */\n  --container-tight: 720px;  /* prose / forms */\n  --gutter:         var(--space-6);\n  --section-y:      var(--space-10);\n}\n\n/* Jannat al Qulûb — Effects: radii, borders, shadows, motion\n   Soft, gentle, organic. Generous rounding, whisper-soft warm shadows. */\n:root {\n  /* ——— Radii ——— */\n  --radius-sm:   8px;\n  --radius-md:   14px;\n  --radius-lg:   22px;\n  --radius-xl:   32px;\n  --radius-pill: 999px;\n  --radius-arch: 999px 999px 0 0; /* the mihrab arch motif */\n\n  /* ——— Borders ——— */\n  --border-hair:  1px solid var(--border-subtle);\n  --border-soft:  1px solid var(--border-strong);\n  --border-gold:  1px solid var(--gold-soft);\n\n  /* ——— Shadows (warm-toned, never grey) ——— */\n  --shadow-xs:  0 1px 2px rgba(64, 56, 49, 0.05);\n  --shadow-sm:  0 2px 8px rgba(64, 56, 49, 0.06);\n  --shadow-md:  0 8px 24px rgba(64, 56, 49, 0.08);\n  --shadow-lg:  0 18px 48px rgba(64, 56, 49, 0.10);\n  --shadow-gold: 0 6px 20px rgba(162, 132, 58, 0.16);\n\n  /* ——— Motion: calm, never bouncy ——— */\n  --ease-soft:   cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-inout:  cubic-bezier(0.45, 0, 0.55, 1);    /* @kind other */\n  --dur-fast:    160ms; /* @kind other */\n  --dur-base:    260ms; /* @kind other */\n  --dur-slow:    420ms; /* @kind other */\n}\n\n/* Jannat al Qulûb — Base element styles (opt-in via .jaq-prose / global resets) */\n:root {\n  color-scheme: light;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg-page);\n  color: var(--text-body);\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  font-weight: var(--weight-regular);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-heading);\n  color: var(--text-heading);\n  font-weight: var(--weight-medium);\n  line-height: var(--leading-tight);\n  margin: 0;\n}\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 3px; }\n\n::selection { background: var(--gold-soft); color: var(--ink); }\n\n:where(button, [role=\"button\"], input, select, textarea):focus-visible {\n  outline: 3px solid var(--focus-ring);\n  outline-offset: 2px;\n}\n\n/* ——— Component interaction states (hover/press) ——— */\n.jaq-btn:hover { transform: translateY(-1px); }\n.jaq-btn:active { transform: translateY(0) scale(0.985); }\n.jaq-btn--primary:hover { background: var(--accent-deep); }\n.jaq-btn--gold:hover { background: var(--gold-deep); color: var(--cream); }\n.jaq-btn--secondary:hover { background: color-mix(in oklab, var(--sage-deep) 8%, transparent); }\n.jaq-btn--ghost:hover { background: var(--surface-well); }\n\n.jaq-card--interactive { transition: transform var(--dur-base) var(--ease-soft), box-shadow var(--dur-base) var(--ease-soft); }\n.jaq-card--interactive:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }\n\n.jaq-input:focus { border-color: var(--gold); background: var(--cream); }\n.jaq-accordion__head { transition: color var(--dur-base) var(--ease-soft); }\n.jaq-accordion__head:hover { color: var(--accent-deep); }\n\n/* Eyebrow / subtitle treatment — the brand's letterspaced caps label */\n.jaq-eyebrow {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-light);\n  font-size: var(--text-sm);\n  letter-spacing: var(--tracking-wider);\n  text-transform: uppercase;\n  color: var(--ink-muted);\n}\n\n<\u002Fstyle>\n  <script src=\"90af38f7-f028-457c-aa1a-840e64b66c75\"><\u002Fscript>\n  <link rel=\"icon\" href=\"f6238630-4521-4315-b73c-1ceb60bde462\">\n  <link rel=\"apple-touch-icon\" href=\"f6238630-4521-4315-b73c-1ceb60bde462\">\n  <meta name=\"theme-color\" content=\"#8A9789\">\n  <style>\n    html, body { margin: 0; padding: 0; }\n    body { background: #efe7d9; -webkit-font-smoothing: antialiased; }\n    *::-webkit-scrollbar { width: 0; height: 0; }\n    @keyframes amzAmb { 0% { transform: translate3d(0,0,0) scale(1); } 100% { transform: translate3d(2%,-3%,0) scale(1.12); } }\n    @keyframes amzBreath { 0%,100% { transform: scale(.62); } 40% { transform: scale(1); } 58% { transform: scale(1); } }\n    @keyframes amzBloom { from { transform: scale(0) translateY(6px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }\n    @keyframes amzFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }\n    @keyframes amzRise { from { transform: translateY(14px); } to { transform: none; } }\n    @keyframes amzFade { from { opacity: 0; } to { opacity: 1; } }\n    @keyframes amzShine { 0% { background-position: 140% 0; } 60%,100% { background-position: -40% 0; } }\n    @keyframes amzSun { 0%,100% { box-shadow: 0 0 30px 6px rgba(216,183,122,.45); } 50% { box-shadow: 0 0 46px 12px rgba(216,183,122,.65); } }\n    .amz-scroll::-webkit-scrollbar { width: 0; }\n    .amz-screen > * { animation: amzRise .5s ease both; }\n    .amz-screen > *:nth-child(2) { animation-delay: .05s; }\n    .amz-screen > *:nth-child(3) { animation-delay: .1s; }\n    .amz-screen > *:nth-child(4) { animation-delay: .15s; }\n    .amz-screen > *:nth-child(5) { animation-delay: .2s; }\n    .amz-scre weight: 600; cursor: pointer; padding: 0;\">‹ Retour<\u002Fbutton>\n        <div style=\"font-size: 40px; margin-top: 14px;\">{{ fiche.emoji }}<\u002Fdiv>\n        <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 29px; color: #4A554A; margin: 4px 0 8px; line-height: 1.08;\">{{ fiche.titre }}<\u002Fh2>\n        <p style=\"font-size: 14.5px; color: #5E4D42; line-height: 1.62; margin: 0 0 16px;\">{{ fiche.intro }}<\u002Fp>\n\n        <sc-if value=\"{{ fiche.hasCards }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-for list=\"{{ fiche.cards }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"background: #FCFAF4; border: 1px solid #efe6d8; border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 4px 16px rgba(110,95,70,.06);\">\n              <div style=\"display: flex; align-items: center; gap: 9px; margin-bottom: 6px;\"><span style=\"font-size: 20px;\">{{ c.e }}<\u002Fspan><span style=\"font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; color: #4A554A;\">{{ c.t }}<\u002Fspan><\u002Fdiv>\n              <sc-for list=\"{{ c.lines }}\" as=\"ln\" hint-placeholder-count=\"3\">\n                <div style=\"font-size: 13.5px; color: #5E4D42; line-height: 1.5; padding: 2px 0;\">{{ ln }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ fiche.hasParas }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-for list=\"{{ fiche.paras }}\" as=\"para\" hint-placeholder-count=\"3\">\n            <p style=\"font-size: 14px; color: #5E4D42; line-height: 1.65; margin: 0 0 12px;\">{{ para }}<\u002Fp>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ fiche.hasSections }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-for list=\"{{ fiche.sections }}\" as=\"sec\" hint-placeholder-count=\"4\">\n            <div style=\"margin-bottom: 14px;\">\n              <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: #677465; margin: 6px 2px 8px;\">{{ sec.h }}<\u002Fdiv>\n              <div style=\"background: #FCFAF4; border: 1px solid #efe6d8; border-radius: 16px; padding: 6px 16px; box-shadow: 0 4px 14px rgba(110,95,70,.05);\">\n                <sc-for list=\"{{ sec.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                  <div style=\"position: relative; padding: 9px 0 9px 16px; border-bottom: 1px solid #f1e9db; font-size: 13.5px; color: #5E4D42; line-height: 1.5;\"><span style=\"position: absolute; left: 0; top: 16px; width: 6px; height: 6px; border-radius: 50%; background: #D8B77A;\"><\u002Fspan>{{ it }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ fiche.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: linear-gradient(180deg, #fbf6ec, #f5ecd9); border: 1px solid #ecdcbf; border-radius: 18px; padding: 16px 18px; margin-top: 6px;\">\n            <blockquote style=\"margin: 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16.5px; line-height: 1.5; color: #4A554A; border: none; padding: 0;\">{{ fiche.note }}<\u002Fblockquote>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ fiche.hasCta }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ ficheToOrga }}\" style=\"width: 100%; background: linear-gradient(135deg, #C88E7F, #A96B5B); color: #FCFAF4; border: none; border-radius: 14px; padding: 14px; font-family: 'Jost', sans-serif; font-size: 14.5px; font-weight: 600; cursor: pointer; margin-top: 14px;\">{{ fiche.cta }}<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <button onclick=\"{{ closeFiche }}\" style=\"width: 100%; background: transparent; color: #677465; border: 1.5px solid #DACDBC; border-radius: 14px; padding: 13px; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px;\">Retour<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ════ JOURNAL DES PENSÉES OVERLAY ════ -->\n    <sc-if value=\"{{ showJournal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; z-index: 86; background: linear-gradient(180deg, #f6f0e6, #efe6d6); display: flex; flex-direction: column; animation: amzRise .35s ease;\">\n      <div class=\"amz-scroll\" style=\"flex: 1; overflow-y: auto; padding: 24px 22px 28px;\">\n        <button onclick=\"{{ closeJournal }}\" style=\"background: none; border: none; color: #8C7C70; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0;\">‹ Fermer<\u002Fbutton>\n        <div style=\"font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #A96B5B; font-weight: 500; margin-top: 14px;\">Journal · méthode 5 étapes<\u002Fdiv>\n        <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 27px; color: #4A554A; margin: 4px 0 16px; line-height: 1.1;\">Observer une pensée<\u002Fh2>\n\n        <div style=\"margin-bottom: 13px;\"><div style=\"font-size: 13px; font-weight: 600; color: #677465; margin-bottom: 6px;\">1 · Le fait exact<\u002Fdiv><textarea value=\"{{ jSituation }}\" oninput=\"{{ setJSituation }}\" placeholder=\"Ce qui s'est passé, sans interprétation…\" style=\"width: 100%; box-sizing: border-box; min-height: 56px; resize: vertical; border: 1.5px solid #DACDBC; border-radius: 13px; padding: 11px 13px; font-family: 'Jost', sans-serif; font-size: 14px; color: #3B2B23; background: #FCFAF4;\"><\u002Ftextarea><\u002Fdiv>\n        <div style=\"margin-bottom: 13px;\"><div style=\"font-size: 13px; font-weight: 600; color: #677465; margin-bottom: 6px;\">2 · La pensée, mot pour mot<\u002Fdiv><textarea value=\"{{ jPensee }}\" oninput=\"{{ setJPensee }}\" placeholder=\"Ce que ta tête s'est dit…\" style=\"width: 100%; box-sizing: border-box; min-height: 56px; resize: vertical; border: 1.5px solid #DACDBC; border-radius: 13px; padding: 11px 13px; font-family: 'Jost', sans-serif; font-size: 14px; color: #3B2B23; background: #FCFAF4;\"><\u002Ftextarea><\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; margin-bottom: 13px;\">\n          <div style=\"flex: 1;\"><div style=\"font-size: 13px; font-weight: 600; color: #677465; margin-bottom: 6px;\">3 · L'émotion<\u002Fdiv><input value=\"{{ jEmotion }}\" oninput=\"{{ setJEmotion }}\" placeholder=\"ex. Anxiété\" style=\"width: 100%; box-sizing: border-box; border: 1.5px solid #DACDBC; border-radius: 13px; padding: 11px 13px; font-family: 'Jost', sans-serif; font-size: 14px; color: #3B2B23; background: #FCFAF4;\"><\u002Fdiv>\n          <div style=\"flex: 0 0 92px;\"><div style=\"font-size: 13px; font-weight: 600; color: #677465; margin-bottom: 6px;\">Intensité<\u002Fdiv><input type=\"number\" min=\"0\" max=\"10\" value=\"{{ jIntensite }}\" oninput=\"{{ setJIntensite }}\" style=\"width: 100%; box-sizing: border-box; border: 1.5px solid #DACDBC; border-radius: 13px; padding: 11px 13px; font-family: 'Jost', sans-serif; font-size: 14px; color: #3B2B23; background: #FCFAF4; text-align: center;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-bottom: 13px;\"><div style=\"font-size: 13px; font-weight: 600; color: #677465; margin-bottom: 6px;\">4 · Le comportement<\u002Fdiv><textarea value=\"{{ jComportement }}\" oninput=\"{{ setJComportement }}\" placeholder=\"Ce que tu as fait ensuite…\" style=\"width: 100%; box-sizing: border-box; min-height: 48px; resize: vertical; border: 1.5px solid #DACDBC; border-radius: 13px; padding: 11px 13px; font-family: 'Jost', sans-serif; font-size: 14px; color: #3B2B23; background: #FCFAF4;\"><\u002Ftextarea><\u002Fdiv>\n        <div style=\"font-size: 13px; font-weight: 600; color: #677465; margin-bottom: 8px;\">Un biais à l'œuvre ? (facultatif)<\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;\">\n          <sc-for list=\"{{ biaisChips }}\" as=\"b\" hint-placeholder-count=\"6\"><button onclick=\"{{ b.onClick }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fbutton><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-bottom: 16px;\"><div style=\"font-size: 13px; font-weight: 600; color: #677465; margin-bottom: 6px;\">5 · Une lecture plus juste<\u002Fdiv><textarea value=\"{{ jAlternative }}\" oninput=\"{{ setJAlternative }}\" placeholder=\"Et si je regardais autrement… ?\" style=\"width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical; border: 1.5px solid #DACDBC; border-radius: 13px; padding: 11px 13px; font-family: 'Jost', sans-serif; font-size: 14px; color: #3B2B23; background: #FCFAF4;\"><\u002Ftextarea><\u002Fdiv>\n\n        <button onclick=\"{{ submitJournal }}\" style=\"width: 100%; background: linear-gradient(135deg, #8A9789, #677465); color: #FCFAF4; border: none; border-radius: 16px; padding: 16px; font-family: 'Jost', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 26px rgba(103,116,101,.32);\">Déposer mon observation 🌿<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ════ RÉSUMÉ OVERLAY ════ -->\n    <sc-if value=\"{{ showResume }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; z-index: 86; background: linear-gradient(180deg, #f6f0e6, #efe6d6); display: flex; flex-direction: column; animation: amzRise .35s ease;\">\n      <div class=\"amz-scroll\" style=\"flex: 1; overflow-y: auto; padding: 24px 22px 28px;\">\n        <button onclick=\"{{ closeResume }}\" style=\"background: none; border: none; color: #8C7C70; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0;\">‹ Fermer<\u002Fbutton>\n        <div style=\"font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: #B8954F; font-weight: 500; margin-top: 14px;\">Synthèse<\u002Fdiv>\n        <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 29px; color: #4A554A; margin: 4px 0 4px; line-height: 1.1;\">Ton résumé<\u002Fh2>\n        <p style=\"font-size: 13px; color: #8C7C70; margin: 0 0 16px; line-height: 1.5;\">Une synthèse à relire, à imprimer en PDF, ou à partager avec ton accompagnante.<\u002Fp>\n\n        <div style=\"background: #FCFAF4; border: 1px solid #efe6d8; border-radius: 20px; padding: 20px; box-shadow: 0 6px 22px rgba(110,95,70,.08); margin-bottom: 16px;\">\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: #4A554A; margin-bottom: 14px;\">Cette semaine en un coup d'œil<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;\">\n            <span style=\"background: #e9ede6; color: #677465; border: 1px solid #dde3d8; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600;\">{{ resume.nb }} check-ins<\u002Fspan>\n            <span style=\"background: #f7efe0; color: #B8954F; border: 1px solid #e7d4a9; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600;\">{{ resume.etatEmoji }} État moyen : {{ resume.etat }}<\u002Fspan>\n            <span style=\"background: #f6e4dd; color: #A96B5B; border: 1px solid #ecd1c4; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600;\">{{ resume.nbPensees }} pensées observées<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14px; color: #5E4D42; line-height: 1.6; margin: 0 0 10px;\">Ce qui t'a le plus soutenue : <strong style=\"color: #677465;\">{{ resume.soutien }}<\u002Fstrong>. Ce qui a le plus tiré sur toi : <strong style=\"color: #A96B5B;\">{{ resume.tirant }}<\u002Fstrong>.<\u002Fp>\n          <p style=\"font-size: 14px; color: #5E4D42; line-height: 1.6; margin: 0;\">Tu as traversé : <strong style=\"color: #4A554A;\">{{ resume.zones }}<\u002Fstrong>. C'est important d'en tenir compte, avec douceur.<\u002Fp>\n        <\u002Fdiv>\n\n        <button onclick=\"{{ exportResumePDF }}\" style=\"width: 100%; background: linear-gradient(135deg, #8A9789, #677465); color: #FCFAF4; border: none; border-radius: 14px; padding: 15px; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 22px rgba(103,116,101,.3); margin-bottom: 10px;\">Exporter en PDF<\u002Fbutton>\n        <button onclick=\"{{ exportResumeCSV }}\" style=\"width: 100%; background: #B9ADA0; color: #FCFAF4; border: none; border-radius: 14px; padding: 15px; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;\">Exporter en CSV<\u002Fbutton>\n        <p style=\"font-size: 11.5px; color: #B3A89B; text-align: center; line-height: 1.5; margin: 12px 6px 0;\">Le PDF utilise l'impression de ton navigateur : choisis « Enregistrer en PDF » comme destination.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- toast -->\n    <sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); z-index: 95; background: #3B2B23; color: #f6efe3; padding: 11px 20px; border-radius: 999px; font-family: 'Jost', sans-serif; font-size: 13.5px; font-weight: 600; box-shadow: 0 12px 30px rgba(59,43,35,.3); white-space: nowrap;\">{{ toastMsg }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <div style=\"position: relative; z-index: 1; font-size: 12px; color: #8C7C70; text-align: center; max-width: 360px; line-height: 1.5;\">Prototype interactif · navigue, fais ton check-in, regarde ton jardin pousser. Outil de soutien à la compréhension de soi.<\u002Fdiv>\n\n  \n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 440, &quot;height&quot;: 940}, &quot;prenom&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Sara&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Personnalisation&quot;}, &quot;spirituel&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Personnalisation&quot;}, &quot;serie&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 12, &quot;min&quot;: 0, &quot;max&quot;: 120, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Démo&quot;, &quot;unit&quot;: &quot;jours&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tab: 'accueil',\n    checkin: { energie: 3, humeur: 3, clarte: 3, elan: 3 },\n    zones: [],\n    doneToday: false,\n    todayScore: null,\n    streak: null,\n    showCheckin: false,\n    showCrise: false,\n    spirituel: null,\n    rappel: true,\n    toastOn: false,\n    toastMsg: '',\n    breathIdx: 0,\n    showOrga: false,\n    orga: [3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3],\n    orgaDone: false,\n    orgaNote: '',\n    ficheId: null,\n    showJournal: false,\n    showResume: false,\n    journal: { situation: '', pensee: '', emotion: '', intensite: 5, comportement: '', biais: '', alternative: '' },\n    pensees: [\n      { emotion: 'Anxiété', intensite: '7/10', date: 'hier', pensee: 'Je ne vais jamais y arriver, je suis nulle.', alternative: \"J\\u2019ai eu une journée dure — ça ne dit rien de ma valeur. J\\u2019ai déjà surmonté pire.\" },\n      { emotion: 'Culpabilité', intensite: '5/10', date: 'il y a 3 j', pensee: \"J\\u2019aurais dû faire plus aujourd\\u2019hui.\", alternative: \"Repos n\\u2019est pas paresse. Mon corps demandait une pause, je l\\u2019ai écouté.\" },\n    ],\n  };\n\n  BIAIS_OPTS = ['Catastrophisme', 'Prédiction', 'Lecture de pensée', 'Personnalisation', 'Tout-ou-rien', 'Les exigences'];\n\n  HIST = [2.6,2.4,2.8,3.0,2.7,3.1,2.5,2.9,3.2,3.0,3.3,2.8,3.4,3.1,3.0,3.5,3.3,3.6,3.2,3.7,3.4,3.3,3.8,3.6,3.9,3.5,4.0,3.7,3.8,4.1];\n\n  DIMS  écouter — sans s\\u2019y noyer — t\\u2019aide à comprendre ce qui se joue, souvent là où se trouve le nœud.\",\n      cards: [\n        { e: '🔥', t: 'Colère', a: \"Déclencheur : une limite franchie, une injustice.\", b: \"Fonction : protéger ce qui compte pour toi.\", c: \"Ce qui aide : nommer le besoin derrière, respirer avant d\\u2019agir.\" },\n        { e: '😨', t: 'Peur', a: \"Déclencheur : un danger perçu, connu ou imaginé.\", b: \"Fonction : te mettre en sécurité.\", c: \"Ce qui aide : distinguer danger réel / supposé, revenir au corps.\" },\n        { e: '💧', t: 'Tristesse', a: \"Déclencheur : une perte, un manque.\", b: \"Fonction : ralentir, intégrer, faire le deuil.\", c: \"Ce qui aide : t\\u2019autoriser à pleurer, demander du réconfort.\" },\n        { e: '🫥', t: 'Honte', a: \"Déclencheur : se sentir « pas à la hauteur ».\", b: \"Fonction : préserver le lien aux autres.\", c: \"Ce qui aide : te rappeler — ressentir ≠ être. En parler à une personne sûre.\" },\n        { e: '☀️', t: 'Joie', a: \"Déclencheur : un besoin nourri.\", b: \"Fonction : signaler ce qui est bon pour toi.\", c: \"Ce qui aide : savourer, prolonger, remercier (al-ḥamdu lillāh).\" },\n        { e: '🤍', t: 'Amour', a: \"Déclencheur : un lien, une présence.\", b: \"Fonction : relier, prendre soin.\", c: \"Ce qui aide : l\\u2019exprimer, et le recevoir sans avoir à le mériter.\" },\n      ],\n    },\n    biais: {\n      emoji: '🪞', titre: 'Les 6 biais',\n      intro: \"Les biais sont des raccourcis de pensée qui déforment la réalité. Les repérer, ce n\\u2019est pas se juger — c\\u2019est retrouver une lecture plus juste. Clarifier n\\u2019est pas se rassurer.\",\n      cards: [\n        { e: '🌩️', t: 'Catastrophisme', a: \"Imaginer le pire scénario comme s\\u2019il était certain.\", c: \"Recadrage : « Quelle est l\\u2019issue la plus probable, pas la plus effrayante ? »\" },\n        { e: '🔮', t: 'Prédiction', a: \"Croire qu\\u2019on connaît déjà l\\u2019avenir.\", c: \"Recadrage : « Je ne peux pas le savoir — restons aux faits d\\u2019aujourd\\u2019hui. »\" },\n        { e: '🧠', t: 'Lecture de pensée', a: \"Supposer ce que l\\u2019autre pense de toi.\", c: \"Recadrage : « Ai-je une preuve, ou seulement une interprétation ? »\" },\n        { e: '🎯', t: 'Personnalisation', a: \"Tout ramener à soi, se sentir responsable de tout.\", c: \"Recadrage : « Quelle est ma part réelle ? Quelles autres causes existent ? »\" },\n        { e: '⚫', t: 'Tout-ou-rien', a: \"Voir en noir ou blanc, tout réussi ou tout raté.\", c: \"Recadrage : « Où est la nuance, le ‘en partie’ ? »\" },\n        { e: '⛓️', t: 'Les exigences', a: \"Les « je dois », « il faut » rigides envers toi-même.\", c: \"Recadrage : « Et si je remplaçais ‘je dois’ par ‘j\\u2019aimerais’ ? »\" },\n      ],\n    },\n    charge: {\n      emoji: '🧩', titre: 'Charge mentale',\n      intro: \"La charge mentale, c\\u2019est le poids invisible de devoir tout penser, anticiper et retenir — souvent pour les autres. Elle fatigue avant même d\\u2019agir. La nommer, c\\u2019est déjà l\\u2019alléger.\",\n      sections: [\n        { h: 'Tu la reconnais à…', items: [\"une tête qui ne s\\u2019arrête jamais, même au repos\", \"des oublis, des « il faut que je pense à… » en boucle\", \"une fatigue dès le réveil\", \"de l\\u2019irritabilité quand une demande de plus arrive\"] },\n        { h: 'Ce qui aide vraiment', items: [\"externaliser : tout déposer au même endroit (carnet, note), fini la mémoire\", \"déléguer pour de vrai — ou supprimer une tâche\", \"t\\u2019autoriser un « non » qui te protège\", \"un seul système simple, pas dix outils\"] },\n      ],\n      cta: \"Fais ton mini-bilan « Mon mode d\\u2019organisation » pour cibler ta priorité d\\u2019allègement.\",\n    },\n    hygiene: {\n      emoji: '🌙', titre: 'Hygiène de vie',\n      intro: \"Le corps est un dépôt (amāna) que l\\u2019on honore avec douceur. Voici des repères de bien-être, mêlant bon sens et médecine prophétique — proposés avec douceur, jamais imposés.\",\n      sections: [\n        { h: '🌙 Sommeil', items: [\"se coucher tôt, peu après le ‘ishā, et se lever léger\", \"la sieste courte (qaylūla) en début d\\u2019après-midi répare\", \"dormir sur le côté droit, en état de pureté (wuḍū)\", \"repère moderne : couper les écrans avant le coucher, une heure régulière\", \"une tisane apaisante (camomille, tilleul, mélisse) aide le corps à récupérer\"] },\n        { h: '🍯 Assiette', items: [\"la règle des tiers : « un tiers pour la nourriture, un tiers pour la boisson, un tiers pour le souffle » — ne pas manger à satiété\", \"commencer par Bismillāh, manger doucement, de la main droite\", \"des appuis cités : dattes, miel, eau, huile d\\u2019olive, graine de nigelle (ḥabba sawdā)\", \"repère moderne : des repas à heures régulières, sans écran\", \"soutiens de l\\u2019humeur : magnésium (amandes, épinards), oméga-3 (poissons gras, lin), tryptophane (œufs, dattes, banane) ; limite l\\u2019excès de café et de sucre\"] },\n        { h: '🚶‍♀️ Mouvement', items: [\"bouger chaque jour, même un peu — la marche d\\u2019abord\", \"le corps aime le mouvement régulier plus que l\\u2019effort rare\", \"s\\u2019étirer, respirer, prendre l\\u2019air\", \"même 30 min de marche libèrent des endorphines et font baisser le cortisol (hormone du stress)\"] },\n        { h: '🤍 Lien', items: [\"entretenir les liens (ṣilat ar-raḥim) apaise le cœur\", \"un contact sincère par jour suffit à rompre l\\u2019isolement\", \"demander de l\\u2019aide n\\u2019est pas une faiblesse\"] },\n      ],\n      note: \"Repères de bien-être inspirés de la médecine prophétique — ils ne remplacent ni un avis ni un suivi médical.\",\n    },\n  };\n\n  // Zones de turbulences — moments de vie qui changent le rapport au travail & à l'énergie\n  TURBU_ORDER = ['premenstruel', 'fatigue', 'reprise', 'surcharge', 'burnout', 'depression', 'postpartum', 'menopause', 'deuil', 'preaccouchement', 'choc'];\n  TURBU = {\n    premenstruel: { emoji: '🌙', titre: 'Phase prémenstruelle', tag: 'Cycle',\n      intro: \"Les jours qui précèdent les règles, l\\u2019énergie, l\\u2019humeur et la tolérance à la frustration baissent. Ce n\\u2019est pas « toi en moins bien » — c\\u2019est ton corps qui demande plus de douceur.\",\n      sections: [\n        { h: 'Ce que tu peux ressentir', items: [\"irritabilité, sensibilité à fleur de peau\", \"fatigue, besoin de te replier\", \"pensées plus sombres que d\\u2019habitude\"] },\n        { h: 'Ce qui aide', items: [\"baisser tes attentes : ton corps travaille\", \"repos, chaleur, sucres lents\", \"reporter les décisions lourdes si tu peux\"] },\n        { h: \"Ce qu\\u2019on évite de s\\u2019imposer\", items: [\"t\\u2019en demander autant qu\\u2019un autre jour\", \"prendre chaque émotion pour une vérité\"] },\n      ],\n      note: \"Ce passage revient, et il repart. Note tes jours bas sur ton cycle : tu t\\u2019y prépareras avec plus de tendresse.\" },\n    fatigue: { emoji: '😴', titre: 'Fatigue', tag: 'Corps',\n      intro: \"Quand le corps est fatigué, le cerveau exécutif (planifier, décider, prioriser) tourne au ralenti. Ce n\\u2019est pas un manque de volonté.\",\n      sections: [\n        { h: 'Ce que tu peux ressentir', items: [\"difficulté à te concentrer, à choisir\", \"tout paraît plus lourd\", \"irritabilité\"] },\n        { h: 'Ce qui aide', items: [\"une vraie pause, sans dette ni culpabilité\", \"réduire la liste à l\\u2019essentiel\", \"de l\\u2019eau, un repas, de l\\u2019air\"] },\n        { h: \"Ce qu\\u2019on évite de s\\u2019imposer\", items: [\"compenser par plus de café et de pression\", \"te juger pour ton ralentissement\"] },\n      ],\n      note: \"Se reposer n\\u2019est pas perdre du temps : c\\u2019est réparer l\\u2019outil avec lequel tu travailles.\" },\n    reprise: { emoji: '🌱', titre: 'Reprise progressive', tag: 'Transition',\n      intro: \"Après une pause (maladie, vacances, creux), reprendre à 100 % d\\u2019un coup mène souvent au mur. Le corps a besoin d\\u2019une rampe, pas d\\u2019une marche.\",\n      sections: [\n        { h: 'Ce que tu peux ressentir', items: [\"impression d\\u2019être « rouillée »\", \"découragement devant ce qui s\\u2019est accumulé\"] },\n        { h: 'Ce qui aide', items: [\"reprendre à 60 %, pas à 100 %\", \"une seule priorité le premier jour\", \"célébrer les petits redémarrages\"] },\n        { h: \"Ce qu\\u2019on évite de s\\u2019imposer\", items: [\"vouloir rattraper tout le retard en une fois\"] },\n      ],\n      note: \"Recommencer doucement, c\\u2019est déjà recommencer.\" },\n    surcharge: { emoji: '🧩', titre: 'Surcharge', tag: 'Mental',\n      intro: \"Trop de choses, en même temps, dans la tête. La surcharge mentale brouille les priorités et fatigue avant même d\\u2019agir.\",\n      sections: [\n        { h: 'Ce que tu peux ressentir', items: [\"tête saturée, pensées qui tournent\", \"oublis, sensation de courir partout\"] },\n        { h: 'Ce qui aide', items: [\"vider ta tête sur papier\", \"une seule chose à la fois\", \"un « non » qui te protège\"] },\n        { h: \"Ce qu\\u2019on évite de s\\u2019imposer\", items: [\"ajouter un outil de plus\", \"tout vouloir tenir de mémoire\"] },\n      ],\n      note: \"Tu n\\u2019as pas à tout porter en même temps. Pose, trie, respire.\" },\n    burnout: { emoji: '🔥', titre: 'Épuisement (burn-out)', tag: 'Sensible',\n      intro: \"L\\u2019épuisement professionnel n\\u2019est pas « un coup de mou ». C\\u2019est une fatigue profonde — physique, mentale, émotionnelle — qui s\\u2019installe quand on a trop donné, trop longtemps.\",\n      sections: [\n        { h: 'Ce que tu peux ressentir', items: [\"un épuisement que le repos ne soulage plus\", \"détachement, perte de sens\", \"le moindre effort devient une montagne\"] },\n        { h: 'Ce qui aide', items: [\"ralentir vraiment, pas juste « un peu »\", \"oser demander de l\\u2019aide\", \"te faire accompagner par un professionnel\"] },\n        { h: \"Ce qu\\u2019on évite de s\\u2019imposer\", items: [\"serrer les dents et continuer comme avant\"] },\n      ],\n      note: \"Le burn-out se soigne, et tu n\\u2019as pas à le traverser seule. En parler à un médecin ou un professionnel est une étape juste.\" },\n    depression: { emoji: '🌧️', titre: 'Humeur dépressive', tag: 'Sensible',\n      intro: \"Quand l\\u2019élan vital s\\u2019éteint durablement, ce n\\u2019est pas de la fainéantise. La perte d\\u2019envie, de plaisir, d\\u2019énergie est un signal à prendre au sérieux, avec douceur.\",\n      sections: [\n        { h: 'Ce que tu peux ressentir', items: [\"plus d\\u2019envie, plus de plaisir\", \"fatigue constante, sommeil perturbé\", \"pensées sombres, dévalorisation\"] },\n        { h: 'Ce qui aide', items: [\"de tout petits pas, un seul par jour\", \"lumière, mouvement doux, lien\", \"un avis médical ou psychologique\"] },\n        { h: \"Ce qu\\u2019on évite de s\\u2019imposer\", items: [\"te reprocher de « ne pas y arriver »\"] },\n      ],\n      note: \"Si cela dure ou s\\u2019aggrave, parles-en à un professionnel de santé — c\\u2019est un acte de courage. En cas de pensées suicidaires : 3114 (24h/24).\" },\n    postpartum: { emoji: '🍼', titre: 'Post-partum', tag: 'Maternité',\n      intro: \"Après une naissance, le corps, les hormones et le sommeil sont bouleversés. Vouloir « redevenir comme avant » tout de suite ajoute une pression dont tu n\\u2019as pas besoin.\",\n      sections: [\n        { h: 'Ce que tu peux ressentir', items: [\"fatigue extrême, émotions en montagnes russes\", \"sentiment d\\u2019être dépassée, culpabilité\"] },\n        { h: 'Ce qui aide', items: [\"accepter l\\u2019aide, déléguer sans honte\", \"dormir quand le bébé dort\", \"te nourrir, t\\u2019hydrater, t\\u2019entourer\"] },\n        { h: \"Ce qu\\u2019on évite de s\\u2019imposer\", items: [\"te comparer, viser la perfection\"] },\n      ],\n      note: \"Si la tristesse s\\u2019installe au-delà de quelques semaines, parles-en : la dépression post-partum se soigne très bien.\" },\n    menopause: { emoji: '🌸', titre: 'Ménopause / périménopause', tag: 'Cycle',\n      intro: \"Les variations hormonales peuvent agir sur l\\u2019énergie, le sommeil, la mémoire et l\\u2019humeur. Ce n\\u2019est pas « dans ta tête » — c\\u2019est une vraie transition.\",\n      sections: [\n        { h: 'Ce que tu peux ressentir', items: [\"bouffées, sommeil haché, fatigue\", \"irritabilité, baisse de moral\", \"sensation de moins te reconnaître\"] },\n        { h: 'Ce qui aide', items: [\"respecter ton nouveau rythme\", \"mouvement doux, alimentation qui soutient\", \"en parler à un médecin si besoin\"] },\n        { h: \"Ce qu\\u2019on évite de s\\u2019imposer\", items: [\"nier ou minimiser ce que tu vis\"] },\n      ],\n      note: \"C\\u2019est un passage, pas une fin. Beaucoup de femmes y retrouvent une forme de liberté nouvelle.\" },\n    deuil: { emoji: '🤍', titre: 'Séparation / deuil', tag: 'Sensible',\n      intro: \"Une perte (rupture, décès, fin d\\u2019un cycle de vie) mobilise énormément d\\u2019énergie psychique. Le deuil n\\u2019est pas linéaire, et il a son propre rythme.\",\n      sections: [\n        { h: 'Ce que tu peux ressentir', items: [\"vagues de tristesse, parfois de colère\", \"fatigue, perte de repères\", \"besoin de te retirer\"] },\n        { h: 'Ce qui aide', items: [\"laisser venir les émotions, sans les forcer\", \"t\\u2019appuyer sur un lien sûr\", \"des rituels doux pour honorer la perte\"] },\n        { h: \"Ce qu\\u2019on évite de s\\u2019imposer\", items: [\"te fixer un délai pour « aller mieux »\"] },\n      ],\n      note: \"On ne « tourne pas la page » : on apprend à vivre avec. Sois patiente avec toi. Qu\\u2019Allāh facilite.\" },\n    preaccouchement: { emoji: '🪺', titre: 'Préaccouchement', tag: 'Maternité',\n      intro: \"Les dernières semaines de grossesse demandent au corps une énergie immense. Préparer la naissance, c\\u2019est aussi se préparer intérieurement, en douceur.\",\n      sections: [\n        { h: 'Ce que tu peux ressentir', items: [\"fatigue, lourdeur, sommeil difficile\", \"impatience mêlée d\\u2019appréhension\"] },\n        { h: 'Ce qui aide', items: [\"ralentir, déléguer, te reposer souvent\", \"préparer l\\u2019essentiel, lâcher le reste\", \"respiration, ancrage, du\\u2019a d\\u2019apaisement\"] },\n        { h: \"Ce qu\\u2019on évite de s\\u2019imposer\", items: [\"vouloir tout contrôler et tout finir\"] },\n      ],\n      note: \"Ton corps sait. Fais-lui confiance, un souffle après l\\u2019autre.\" },\n    choc: { emoji: '⚡', titre: 'Choc émotionnel', tag: 'Sensible',\n      intro: \"Un choc émotionnel (perte, rupture, mauvaise nouvelle, événement bouleversant) est une réaction normale à une situation anormale. Le corps et l\\u2019esprit ont besoin de temps pour absorber.\",\n      sections: [\n        { h: 'Ce que tu peux ressentir', items: [\"sidération, sensation d\\u2019irréel\", \"émotions fortes — ou, au contraire, engourdissement\", \"sommeil et appétit perturbés\"] },\n        { h: 'Ce qui aide', items: [\"revenir au corps : respirer, t\\u2019ancrer (5-4-3-2-1)\", \"ne pas rester seule, parler\", \"reporter les grandes décisions\"] },\n        { h: \"Ce qu\\u2019on évite de s\\u2019imposer\", items: [\"te forcer à « être forte » tout de suite\"] },\n      ],\n      note: \"Si les symptômes persistent ou t\\u2019envahissent, un accompagnement (psychologue) aide à traverser. Le mode « Respirer » est là à tout moment.\" },\n  };\n\n  // Mini-articles psychoéducatifs\n  ARTICLES_ORDER = ['charge-mentale', 'energie', 'procrastination', 'perfectionnisme', 'mode-crise', 'valeur', 'art-biais', 'methode-5', 'dissonance', 'trauma', 'neuroplasticite', 'radar', 'discipline'];\n  ARTICLES = {\n    'charge-mentale': { emoji: '🧩', titre: 'La charge mentale, c\\u2019est quoi ?', min: '2 min',\n      paras: [\"La charge mentale, c\\u2019est le travail invisible de penser, organiser et anticiper — souvent pour les autres autant que pour soi. Elle ne se voit pas, mais elle épuise.\", \"La soulager, c\\u2019est externaliser (tout poser quelque part), déléguer pour de vrai, et accepter que « bien » suffit. Tu n\\u2019as pas à tout tenir de mémoire.\"] },\n    energie: { emoji: '🔋', titre: 'Ton énergie n\\u2019est pas linéaire', min: '2 min',\n      paras: [\"Ton énergie suit des cycles — dans la journée, dans le mois, dans la vie. Vouloir être au même niveau en permanence, c\\u2019est lutter contre ta nature.\", \"Repère tes pics (souvent le matin) et tes creux. Place le plus exigeant sur tes pics, protège tes creux. Travailler avec ton énergie fatigue moins que de la forcer.\"] },\n    procrastination: { emoji: '⏳', titre: 'Procrastiner = un problème d\\u2019émotion', min: '2 min',\n      paras: [\"On croit que procrastiner, c\\u2019est de la paresse. C\\u2019est presque toujours une émotion : peur d\\u2019échouer, de mal faire, ennui, ou tâche trop floue.\", \"La clé n\\u2019est pas plus de discipline, mais de réduire l\\u2019émotion : découper en un premier pas minuscule (2 minutes) et clarifier ce qu\\u2019on attend vraiment de toi.\"] },\n    perfectionnisme: { emoji: '🎯', titre: 'Le perfectionnisme qui bloque', min: '2 min',\n      paras: [\"Le perfectionnisme promet l\\u2019excellence et livre la paralysie : tant que ce n\\u2019est pas parfait, on ne montre rien, on ne finit rien.\", \"« Fait » vaut mieux que « parfait ». Vise le « suffisamment bien », fixe une limite de temps, et rappelle-toi : l\\u2019imperfection rend humain et accessible.\"] },\n    'mode-crise': { emoji: '🆘', titre: 'Quand tout déborde : le mode crise', min: '1 min',\n      paras: [\"Certains jours, l\\u2019objectif n\\u2019est pas d\\u2019avancer, mais de traverser. C\\u2019est légitime.\", \"Reviens au corps : respire lentement, ancre-toi (5-4-3-2-1), fais une seule micro-action, contacte une personne sûre. Le bouton « Respirer », en haut, est là pour ça.\"] },\n    valeur: { emoji: '💛', titre: 'Ta valeur n\\u2019est pas ton rendement', min: '1 min',\n      paras: [\"Tu n\\u2019es pas une machine à produire. Ta valeur ne se mesure pas à ta liste cochée.\", \"Un jour bas ne te rend pas moins digne. Tu vaux pour ce que tu es, pas pour ce que tu fais.\"] },\n    'art-biais': { emoji: '🪞', titre: 'Les 6 biais cognitifs', min: '3 min',\n      paras: [\"Nos pensées prennent des raccourcis qui déforment la réalité : catastrophisme, prédiction, lecture de pensée, personnalisation, tout-ou-rien, et les « je dois » rigides.\", \"Les repérer, ce n\\u2019est pas se juger — c\\u2019est retrouver une lecture plus juste. La fiche « Les 6 biais » (Comprendre) les détaille avec un recadrage pour chacun.\"] },\n    'methode-5': { emoji: '🪜', titre: 'La méthode en 5 étapes', min: '2 min',\n      paras: [\"Pour démêler une pensée qui fait mal : 1) le fait exact · 2) la pensée mot pour mot · 3) l\\u2019émotion + son intensité · 4) le comportement · 5) la conséquence — puis une lecture plus juste.\", \"Clarifier n\\u2019est pas se rassurer : c\\u2019est regarder les faits en face. L\\u2019onglet « Pensées » te guide pas à pas.\"] },\n    dissonance: { emoji: '↔️', titre: 'La dissonance : quand quelque chose tire à contre-sens', min: '2 min',\n      paras: [\"La dissonance, c\\u2019est l\\u2019inconfort de faire ou vivre quelque chose qui va contre tes valeurs profondes. Le corps le ressent avant la tête.\", \"Plutôt que de l\\u2019étouffer, écoute-la : qu\\u2019est-ce qui n\\u2019est pas aligné ? Souvent, elle pointe un ajustement nécessaire, à faire en douceur.\"] },\n    trauma: { emoji: '🧠', titre: 'Le trauma et le cerveau : ce n\\u2019est pas une faiblesse', min: '3 min',\n      paras: [\"Face à un événement qui dépasse nos ressources, le cerveau bascule en survie. Les réactions (sidération, hypervigilance, évitement) ne sont pas des faiblesses : ce sont des protections.\", \"Le trauma se travaille, et le cerveau peut se réparer. Un accompagnement adapté aide à dénouer ce qui reste figé — tu n\\u2019as pas à le porter seule.\"] },\n    neuroplasticite: { emoji: '🔄', titre: 'Tu peux changer : la neuroplasticité', min: '2 min',\n      paras: [\"Le cerveau n\\u2019est pas figé : il se remodèle avec ce qu\\u2019on répète. Chaque petit geste nouveau trace, peu à peu, un nouveau chemin.\", \"C\\u2019est pourquoi la régularité compte plus que l\\u2019intensité. Tu n\\u2019es pas condamnée à tes vieux schémas — tu peux, doucement, en créer d\\u2019autres.\"] },\n    radar: { emoji: '📡', titre: 'Le radar de perception : entre l\\u2019événement et toi', min: '2 min',\n      paras: [\"Entre ce qui arrive et ce que tu ressens, il y a une étape invisible : ta lecture de l\\u2019événement. Ce n\\u2019est pas la situation qui crée l\\u2019émotion, mais le sens qu\\u2019on lui donne.\", \"Bonne nouvelle : cette lecture peut s\\u2019assouplir. Changer l\\u2019interprétation, c\\u2019est changer le ressenti — sans nier la réalité.\"] },\n    discipline: { emoji: '🌱', titre: 'Discipline douce : l\\u2019effet cumulé', min: '2 min',\n      paras: [\"La motivation est un feu de paille. Ce qui transforme, c\\u2019est l\\u2019effet cumulé : un petit geste, répété, jour après jour.\", \"La discipline douce ne se fait pas à la cravache : elle s\\u2019appuie sur des habitudes minuscules, tenables, et sur la bienveillance quand on manque un jour.\"] },\n  };\n\n  ANCRAGE = [\n    { n: '5', text: 'choses que tu vois' },\n    { n: '4', text: 'choses que tu touches' },\n    { n: '3', text: 'sons que tu entends' },\n    { n: '2', text: 'odeurs autour de toi' },\n    { n: '1', text: 'chose que tu goûtes — une respiration lente' },\n  ];\n\n  BREATHS = ['Inspire… doucement', 'Retiens un instant', 'Expire… relâche tout', 'Repose-toi'];\n\n  // Mini-audit auto-entrepreneure — 12 questions, 4 rubriques, échelle 1–5.\n  // Polarité cohérente avec les seuils (score haut = faible surcharge) :\n  // les items négatifs (penser au travail hors horaires, solitude, culpabilité) sont reverse-codés (6 - réponse).\n  ORGA_SCALE = ['Pas du tout', 'Plutôt non', 'Moyennement', 'Plutôt oui', 'Tout à fait'];\n  ORGA_CATS = [\n    { key: 'mentale', label: 'Charge mentale', emoji: '🧠', qs: [\n      { t: \"Je pense à mon activité en dehors de mes horaires de travail.\", rev: true },\n      { t: \"J\\u2019ai l\\u2019impression de devoir tout retenir seule.\", rev: true },\n      { t: \"L\\u2019administratif me fatigue rapidement.\", rev: true },\n    ] },\n    { key: 'orga', label: 'Organisation', emoji: '🗂️', qs: [\n      { t: \"Je sais distinguer l\\u2019urgent de l\\u2019important.\", rev: false },\n      { t: \"J\\u2019ai un système simple pour noter, suivre et retrouver mes informations.\", rev: false },\n      { t: \"Mes outils m\\u2019aident plus qu\\u2019ils ne m\\u2019encombrent.\", rev: false },\n    ] },\n    { key: 'energie', label: 'Énergie', emoji: '🌿', qs: [\n      { t: \"Je connais mes moments de meilleure concentration.\", rev: false },\n      { t: \"Mon organisation tient même quand je suis fatiguée.\", rev: false },\n      { t: \"Je récupère correctement après une période intense.\", rev: false },\n    ] },\n    { key: 'posture', label: \"Posture d\\u2019indépendante\", emoji: '🧭', qs: [\n      { t: \"Je me sens souvent seule à prendre les décisions.\", rev: true },\n      { t: \"Je culpabilise quand je ralentis.\", rev: true },\n      { t: \"Je sais poser des limites à mon activité.\", rev: false },\n    ] },\n  ];\n\n  // seuils globaux (score /60). Score haut = faible surcharge.\n  ORGA_GLOBAL = [\n    { min: 48, key: 'faible', label: 'Surcharge faible', color: '#8A9789',\n      summary: \"Ton fonctionnement est globalement stable. Garde tes repères et surveille les périodes ponctuelles d\\u2019accumulation.\",\n      advice: [\"Maintiens tes routines actuelles\", \"Planifie un point hebdo de 20 min\", \"Repère tôt les signes d\\u2019accumulation (fatigue, irritabilité)\"] },\n    { min: 36, key: 'moderee', label: 'Surcharge modérée', color: '#D8B77A',\n      summary: \"Ton organisation tient, mais elle te demande de l\\u2019énergie régulièrement. Quelques ajustements ciblés peuvent te soulager vite.\",\n      advice: [\"Clarifie 3 priorités par semaine\", \"Rassemble tes notes dans un seul outil\", \"Automatise une tâche admin récurrente\"] },\n    { min: 24, key: 'elevee', label: 'Surcharge élevée', color: '#C88E7F',\n      summary: \"Ton système te coûte beaucoup d\\u2019effort mental. La priorité : simplifier et externaliser tes informations.\",\n      advice: [\"Choisis un seul outil central\", \"Limite ta to-do du jour à 3 actions\", \"Automatise ou délègue l\\u2019administratif\"] },\n    { min: 12, key: 'tres', label: 'Surcharge très élevée', color: '#A96B5B',\n      summary: \"Ton niveau de surcharge paraît important. Réduis dès maintenant les sollicitations et protège tes temps de récupération.\",\n      advice: [\"Mets en pause les tâches non essentielles\", \"Externalise ou demande de l\\u2019aide pour l\\u2019administratif\", \"Installe une routine de déconnexion stricte\"] },\n  ];\n\n  // feedback par rubrique selon le niveau (fragile / moyen / fort)\n  ORGA_CATFB = {\n    mentale: { fragile: \"Tu portes beaucoup de choses en tête. L\\u2019enjeu : externaliser davantage.\", moyen: \"Tu peux encore alléger certains points, surtout les tâches répétitives.\", fort: \"Ta capacité à mettre à distance semble bonne.\" },\n    orga: { fragile: \"Ton système est sans doute trop flou ou éclaté. Simplifie tes outils.\", moyen: \"Ton organisation est là, mais elle gagnerait à être consolidée.\", fort: \"Ton organisation paraît solide et fonctionnelle.\" },\n    energie: { fragile: \"Ton organisation ne tient pas assez compte de ton énergie. Priorité à la récupération.\", moyen: \"Tu as quelques repères, mais ils peuvent être mieux respectés.\", fort: \"Tu sais plutôt bien adapter ton activité à ton rythme.\" },\n    posture: { fragile: \"Tu as besoin de poser des limites plus nettes et d\\u2019apaiser la pression intérieure.\", moyen: \"Ta posture se construit, avec encore quelques zones de culpabilité.\", fort: \"Ta posture d\\u2019indépendante semble plutôt saine.\" },\n  };\n\n  // besoin principal (priorité) selon la rubrique la plus fragile\n  ORGA_BESOIN = {\n    mentale: \"Ton besoin principal, c\\u2019est la simplification. Supprimer, fusionner ou automatiser certaines tâches aura plus d\\u2019impact qu\\u2019un nouvel outil.\",\n    orga: \"Ton besoin principal, c\\u2019est la clarté. Un tableau simple, des priorités limitées et un suivi unique t\\u2019aideront plus que plusieurs outils séparés.\",\n    energie: \"Ton besoin principal, c\\u2019est la récupération. Avant d\\u2019ajouter des méthodes, protège tes pauses, ton sommeil et tes fins de journée.\",\n    posture: \"Ton besoin principal, c\\u2019est le soutien. La solitude des décisions et la pression intérieure pèsent sans doute beaucoup dans ton organisation.\",\n  };\n\n  ORGA_TOOLMAP = { mentale: 'memo', orga: 'prio', energie: 'deco', posture: 'deco' };\n  ORGA_TOOLS = {\n    memo: { heading: 'Mémoire saturée — pour décharger ta tête', desc: \"Centralise notes et tâches dans un seul endroit visible.\",\n      ex: [{ name: 'Notion', why: 'notes + tâches + modèles, au même endroit' }, { name: 'Todoist', why: 'listes simples, rappels récurrents' }, { name: 'Google Keep', why: 'captures rapides depuis le mobile' }] },\n    prio: { heading: 'Difficulté à prioriser — pour y voir clair', desc: \"Une vue hebdo + la règle des 3 priorités.\",\n      ex: [{ name: 'Trello (Kanban)', why: 'À faire / En cours / Fait, en visuel' }, { name: 'Un agenda papier', why: '3 priorités par jour, rien de plus' }, { name: 'Asana (Board)', why: 'projets + priorités si besoin' }] },\n    deco: { heading: 'Récupérer & déconnecter — pour souffler', desc: \"Des routines qui ferment la journée et coupent le bruit.\",\n      ex: [{ name: 'Mode Concentration', why: 'silence les notifications pro' }, { name: 'Plages “non dispo”', why: 'des blocs non réservables dans l\\u2019agenda' }, { name: 'Une routine de fin', why: 'un geste qui signe la fin du travail' }] },\n  };\n\n  componentWillUnmount() { if (this._bt) clearInterval(this._bt); if (this._tt) clearTimeout(this._tt); }\n\n  todayStr() { const n = new Date(); return n.getFullYear() + '-' + (n.getMonth() + 1) + '-' + n.getDate(); }\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem('almizan.v2');\n      if (!raw) return;\n      const d = JSON.parse(raw);\n      const patch = {};\n      if (typeof d.streak === 'number') patch.streak = d.streak;\n      if (d.spirituel != null) patch.spirituel = d.spirituel;\n      if (d.rappel != null) patch.rappel = d.rappel;\n      if (d.lastCheckinDate === this.todayStr()) {\n        patch.doneToday = true;\n        if (typeof d.todayScore === 'number') patch.todayScore = d.todayScore;\n        if (d.checkin) patch.checkin = d.checkin;\n      }\n      if (Object.keys(patch).length) this.setState(patch);\n      if (Array.isArray(d.pensees) && d.pensees.length) this.setState({ pensees: d.pensees });\n    } catch (e) {}\n  }\n\n  save() {\n    try {\n      const s = this.state;\n      localStorage.setItem('almizan.v2', JSON.stringify({\n        streak: this.baseStreak(),\n        spirituel: this.isSpi(),\n        rappel: s.rappel,\n        doneToday: s.doneToday,\n        todayScore: s.todayScore,\n        checkin: s.checkin,\n        pensees: s.pensees,\n        lastCheckinDate: s.doneToday ? this.todayStr() : null,\n      }));\n    } catch (e) {}\n  }\n\n  baseStreak() { return this.state.streak != null ? this.state.streak : (this.props.serie ?? 12); }\n  isSpi() { return this.state.spirituel != null ? this.state.spirituel : (this.props.spirituel ?? true); }\n\n  getEtat(c) {\n    const s = (c.energie + c.humeur + c.clarte + c.elan) / 4;\n    let lvl;\n    if (s < 2.0) lvl = { label: 'Jour bas', emoji: '🌫️', color: '#A96B5B', msg: \"Aujourd\\u2019hui, traverser suffit. Sois douce avec to ens', text: 'Choisis le pourquoi avant le comment.' }],\n    };\n    const byZone = {\n      premenstruel: { tag: 'Cycle', text: 'Baisse tes attentes, ton corps travaille.' },\n      fatigue: { tag: 'Repos', text: 'Autorise-toi une vraie pause, sans dette.' },\n      charge: { tag: 'Charge', text: 'Délègue ou supprime une seule chose.' },\n      surcharge: { tag: 'Limite', text: 'Un “non” aujourd\\u2019hui te protège.' },\n      solitude: { tag: 'Lien', text: 'Un contact, même bref, suffit.' },\n      reprise: { tag: 'Douceur', text: 'Reprends à 60 %, pas à 100 %.' },\n    };\n    let out = [...byDim[low]];\n    zones.forEach(z => { if (byZone[z]) out.push(byZone[z]); });\n    const seen = new Set();\n    out = out.filter(r => { if (seen.has(r.text)) return false; seen.add(r.text); return true; });\n    return out.slice(0, 4);\n  }\n\n  buildPath(arr, w, h) {\n    const n = arr.length, pad = 8;\n    return arr.map((v, i) => {\n      const x = pad + (i / (n - 1)) * (w - pad * 2);\n      const y = h - 16 - ((v - 1) / 4) * (h - 36);\n      return `${x.toFixed(1)},${y.toFixed(1)}`;\n    }).join(' ');\n  }\n\n  showToast = (msg) => {\n    const m = typeof msg === 'string' ? msg : 'Bientôt — saisie guidée en 5 étapes 🌿';\n    this.setState({ toastOn: true, toastMsg: m });\n    if (this._tt) clearTimeout(this._tt);\n    this._tt = setTimeout(() => this.setState({ toastOn: false }), 2400);\n  };\n\n  go = (tab) => () => this.setState({ tab });\n\n  openCheckin = () => this.setState({ showCheckin: true });\n  closeCheckin = () => this.setState({ showCheckin: false });\n\n  onSlider = (e) => {\n    const { name, value } = e.target;\n    this.setState(s => ({ checkin: { ...s.checkin, [name]: +value } }));\n  };\n\n  toggleZone = (id) => () => this.setState(s => ({\n    zones: s.zones.includes(id) ? s.zones.filter(z => z !== id) : [...s.zones, id],\n  }));\n\n  submitCheckin = () => {\n    const e = this.getEtat(this.state.checkin);\n    this.setState(s => ({\n      doneToday:
