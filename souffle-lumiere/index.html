  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

and-deep:   #DACDBC; /* borders on cream, dividers */\n  --taupe:       #B9ADA0; /* Taupe — arch fill, muted decorative */\n\n  /* ——— Sauge (foliage) ——— */\n  --sage-soft:   #C0CBB9;\n  --sage:        #8A9789;  /* Sauge — charter */\n  --sage-deep:   #677465;\n  --sage-ink:    #4A554A;\n\n  /* ——— Rose Argile (the winding path) ——— */\n  --clay-soft:   #E2BEB2;\n  --clay:        #C88E7F;  /* Rose Argile — charter */\n  --clay-deep:   #A96B5B;\n\n  /* ——— Or Champagne (the sun, ornaments) ——— */\n  --gold-soft:   #E6CF9C;\n  --gold:        #D8B77A;  /* Or Champagne — charter */\n  --gold-deep:   #B8954F;\n\n  /* ——— Cacao (warm browns) ——— */\n  --ink:         #3B2B23; /* Cacao — primary text */\n  --ink-soft:    #5E4D42; /* secondary text */\n  --ink-muted:   #8C7C70; /* tertiary / captions */\n  --ink-faint:   #B3A89B; /* placeholders, disabled */\n\n  /* ——— Semantic aliases ——— */\n  --bg-page:        var(--ivory);\n  --bg-section:     var(--cream);\n  --bg-section-alt: var(--sand);\n  --surface-card:   var(--cream);\n  --surface-well:   var(--sand);\n\n  --text-heading:   var(--ink);\n  --text-body:      var(--ink-soft);\n  --text-muted:     var(--ink-muted);\n  --text-on-accent: var(--cream);\n  --text-link:      var(--clay-deep);\n\n  --border-subtle:  var(--sand-deep);\n  --border-strong:  var(--taupe);\n  --border-accent:  var(--gold);\n\n  --accent:         var(--clay);       /* primary action / brand warm */\n  --accent-deep:    var(--clay-deep);\n  --accent-cool:    var(--sage-deep);  /* secondary / calm actions */\n  --accent-gold:    var(--gold);       /* ornaments, highlights */\n\n  --focus-ring:     color-mix(in oklab, var(--gold) 55%, transparent);\n}\n<\u002Fstyle>\n  <style>/* Jannat al Qulûb — Typography tokens */\n:root {\n  --font-display: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;\n  --font-sans:    'Jost', 'Century Gothic', 'Segoe UI', system-ui, sans-serif;\n\n  /* Body uses the sans for clarity; display serif for headings & quotes. */\n  --font-body:    var(--font-sans);\n  --font-heading: var(--font-display);\n\n  /* ——— Type scale (fluid-friendly, rem) ——— */\n  --text-xs:   0.75rem;   /* 12px — micro labels */\n  --text-sm:   0.875rem;  /* 14px — captions, fine print */\n  --text-base: 1rem;      /* 16px — body */\n  --text-md:   1.125rem;  /* 18px — lead body */\n  --text-lg:   1.5rem;    /* 24px — small headings */\n  --text-xl:   2rem;      /* 32px — section headings */\n  --text-2xl:  2.75rem;   /* 44px — page headings */\n  --text-3xl:  4rem;      /* 64px — hero wordmark */\n  --text-4xl:  5.5rem;    /* 88px — display */\n\n  /* ——— Weights ——— */\n  --weight-light:    300;\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* ——— Line heights ——— */\n  --leading-tight:   1.1;\n  --leading-snug:    1.25;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.7;\n\n  /* ——— Tracking ——— */\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.08em;  /* labels */\n  --tracking-wider:  0.18em;  /* eyebrow / subtitle caps */\n}\n<\u002Fstyle>\n  <style>/* Jannat al Qulûb — Design System\n   Global entry point. Consumers link this single file.\n   Keep this an @import manifest only — no rules here. */\n/* Jannat al Qulûb — Webfonts\n   Brand wordmark is a refined high-contrast serif → Cormorant Garamond.\n   Subtitle / UI labels are a light, widely-tracked geometric sans → Jost.\n   NOTE: substituted from Google Fonts (originals not provided). See readme. */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Cormorant Garamond';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"164a3d2f-e286-4fab-bf3e-aac65c1c8978\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Cormorant Garamond';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap E-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"311b271d-2478-4759-a357-45ad67333479\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Jannat al Qulûb — Color tokens\n   Aligned to the official brand charter (charte visuelle):\n   Sauge #8A9789 · Amande #E8DDD1 · Ivoire #F6F2EA · Rose Argile #C88E7F\n   · Taupe #B9ADA0 · Cacao #3B2B23 · Or Champagne #D8B77A */\n:root {\n  /* ——— Base: warm neutrals (paper & sand) ——— */\n  --ivory:       #F6F2EA; /* Ivoire — page ground */\n  --cream:       #FCFAF4; /* raised cards / surfaces (lightest paper) */\n  --sand:        #E8DDD1; /* Amande — subtle fills, wells */\n  --sand-deep:   #DACDBC; /* borders on cream, dividers */\n  --taupe:       #B9ADA0; /* Taupe — arch fill, muted decorative */\n\n  /* ——— Sauge (foliage) ——— */\n  --sage-soft:   #C0CBB9;\n  --sage:        #8A9789;  /* Sauge — charter */\n  --sage-deep:   #677465;\n  --sage-ink:    #4A554A;\n\n  /* ——— Rose Argile (the winding path) ——— */\n  --clay-soft:   #E2BEB2;\n  --clay:        #C88E7F;  /* Rose Argile — charter */\n  --clay-deep:   #A96B5B;\n\n  /* ——— Or Champagne (the sun, ornaments) ——— */\n  --gold-soft:   #E6CF9C;\n  --gold:        #D8B77A;  /* Or Champagne — charter */\n  --gold-deep:   #B8954F;\n\n  /* ——— Cacao (warm browns) ——— */\n  --ink:         #3B2B23; /* Cacao — primary text */\n  --ink-soft:    #5E4D42; /* secondary text */\n  --ink-muted:   #8C7C70; /* tertiary / captions */\n  --ink-faint:   #B3A89B; /* placeholders, disabled */\n\n  /* ——— Semantic aliases ——— */\n  --bg-page:        var(--ivory);\n  --bg-section:     var(--cream);\n  --bg-section-alt: var(--sand);\n  --surface-card:   var(--cream);\n  --surface-well:   var(--sand);\n\n  --text-heading:   var(--ink);\n  --text-body:      var(--ink-soft);\n  --text-muted:     var(--ink-muted);\n  --text-on-accent: var(--cream);\n  --text-link:      var(--clay-deep);\n\n  --border-subtle:  var(--sand-deep);\n  --border-strong:  var(--taupe);\n  --border-accent:  var(--gold);\n\n  --accent:         var(--clay);       /* primary action / brand warm */\n  --accent-deep:    var(--clay-deep);\n  --accent-cool:    var(--sage-deep);  /* secondary / calm actions */\n  --accent-gold:    var(--gold);       /* ornaments, highlights */\n\n  --focus-ring:     color-mix(in oklab, var(--gold) 55%, transparent);\n}\n\n/* Jannat al Qulûb — Typography tokens */\n:root {\n  --font-display: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;\n  --font-sans:    'Jost', 'Century Gothic', 'Segoe UI', system-ui, sans-serif;\n\n  /* Body uses the sans for clarity; display serif for headings & quotes. */\n  --font-body:    var(--font-sans);\n  --font-heading: var(--font-display);\n\n  /* ——— Type scale (fluid-friendly, rem) ——— */\n  --text-xs:   0.75rem;   /* 12px — micro labels */\n  --text-sm:   0.875rem;  /* 14px — captions, fine print */\n  --text-base: 1rem;      /* 16px — body */\n  --text-md:   1.125rem;  /* 18px — lead body */\n  --text-lg:   1.5rem;    /* 24px — small headings */\n  --text-xl:   2rem;      /* 32px — section headings */\n  --text-2xl:  2.75rem;   /* 44px — page headings */\n  --text-3xl:  4rem;      /* 64px — hero wordmark */\n  --text-4xl:  5.5rem;    /* 88px — display */\n\n  /* ——— Weights ——— */\n  --weight-light:    300;\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* ——— Line heights ——— */\n  --leading-tight:   1.1;\n  --leading-snug:    1.25;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.7;\n\n  /* ——— Tracking ——— */\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.08em;  /* labels */\n  --tracking-wider:  0.18em;  /* eyebrow / subtitle caps */\n}\n\n/* Jannat al Qulûb — Spacing & layout tokens\n   Generous, airy rhythm on an 8px base. The brand breathes — lots of whitespace. */\n:root {\n  --space-0:   0;\n  --space-1:   0.25rem;  /* 4 */\n  --space-2:   0.5rem;   /* 8 */\n  --space-3:   0.75rem;  /* 12 */\n  --space-4:   1rem;     /* 16 */\n  --space-5:   1.5rem;   /* 24 */\n  --space-6:   2rem;     /* 32 */\n  --space-7:   3rem;     /* 48 */\n  --space-8:   4rem;     /* 64 */\n  --space-9:   6rem;     /* 96 */\n  --space-10:  8rem;     /* 128 — section padding */\n\n  --container:      1120px;  /* max content width */\n  --container-tight: 720px;  /* prose / forms */\n  --gutter:         var(--space-6);\n  --section-y:      var(--space-10);\n}\n\n/* Jannat al Qulûb — Effects: radii, borders, shadows, motion\n   Soft, gentle, organic. Generous rounding, whisper-soft warm shadows. */\n:root {\n  /* ——— Radii ——— */\n  --radius-sm:   8px;\n  --radius-md:   14px;\n  --radius-lg:   22px;\n  --radius-xl:   32px;\n  --radius-pill: 999px;\n  --radius-arch: 999px 999px 0 0; /* the mihrab arch motif */\n\n  /* ——— Borders ——— */\n  --border-hair:  1px solid var(--border-subtle);\n  --border-soft:  1px solid var(--border-strong);\n  --border-gold:  1px solid var(--gold-soft);\n\n  /* ——— Shadows (warm-toned, never grey) ——— */\n  --shadow-xs:  0 1px 2px rgba(64, 56, 49, 0.05);\n  --shadow-sm:  0 2px 8px rgba(64, 56, 49, 0.06);\n  --shadow-md:  0 8px 24px rgba(64, 56, 49, 0.08);\n  --shadow-lg:  0 18px 48px rgba(64, 56, 49, 0.10);\n  --shadow-gold: 0 6px 20px rgba(162, 132, 58, 0.16);\n\n  /* ——— Motion: calm, never bouncy ——— */\n  --ease-soft:   cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-inout:  cubic-bezier(0.45, 0, 0.55, 1);    /* @kind other */\n  --dur-fast:    160ms; /* @kind other */\n  --dur-base:    260ms; /* @kind other */\n  --dur-slow:    420ms; /* @kind other */\n}\n\n/* Jannat al Qulûb — Base element styles (opt-in via .jaq-prose / global resets) */\n:root {\n  color-scheme: light;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg-page);\n  color: var(--text-body);\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  font-weight: var(--weight-regular);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-heading);\n  color: var(--text-heading);\n  font-weight: var(--weight-medium);\n  line-height: var(--leading-tight);\n  margin: 0;\n}\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 3px; }\n\n::selection { background: var(--gold-soft); color: var(--ink); }\n\n:where(button, [role=\"button\"], input, select, textarea):focus-visible {\n  outline: 3px solid var(--focus-ring);\n  outline-offset: 2px;\n}\n\n/* ——— Component interaction states (hover/press) ——— */\n.jaq-btn:hover { transform: translateY(-1px); }\n.jaq-btn:active { transform: translateY(0) scale(0.985); }\n.jaq-btn--primary:hover { background: var(--accent-deep); }\n.jaq-btn--gold:hover { background: var(--gold-deep); color: var(--cream); }\n.jaq-btn--secondary:hover { background: color-mix(in oklab, var(--sage-deep) 8%, transparent); }\n.jaq-btn--ghost:hover { background: var(--surface-well); }\n\n.jaq-card--interactive { transition: transform var(--dur-base) var(--ease-soft), box-shadow var(--dur-base) var(--ease-soft); }\n.jaq-card--interactive:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }\n\n.jaq-input:focus { border-color: var(--gold); background: var(--cream); }\n.jaq-accordion__head { transition: color var(--dur-base) var(--ease-soft); }\n.jaq-accordion__head:hover { color: var(--accent-deep); }\n\n/* Eyebrow / subtitle treatment — the brand's letterspaced caps label */\n.jaq-eyebrow {\n  font-family: var(--font-sans);\n  font-weight: var(--weight-light);\n  font-size: var(--text-sm);\n  letter-spacing: var(--tracking-wider);\n  text-transform: uppercase;\n  color: var(--ink-muted);\n}\n\n<\u002Fstyle>\n  <script src=\"5c52ca5d-ba3f-4d06-bb82-1301613508a4\"><\u002Fscript>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n  <style>/* arabic */\n@font-face {\n  font-family: 'Amiri';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ccacf04d-3295-467a-bece-651d4c333f89\") format('woff2');\n  unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC, U+102E0-102FB, U+10E60-10E7E, U+10EC2-10EC4, U+10EFC-10EFF, U+1EE00-1EE03, U+1EE05-1EE1F, U+1EE21-1EE22, U+1EE24, U+1EE27, U+1EE29-1EE32, U+1EE34-1EE37, U+1EE39, U+1EE3B, U+1EE42, U+1EE47, U+1EE49, U+1EE4B, U+1EE4D-1EE4F, U+1EE51-1EE52, U+1EE54, U+1EE57, U+1EE59, U+1EE5B, U+1EE5D, U+1EE5F, U+1EE61-1EE62, U+1EE64, U+1EE67-1EE6A, U+1EE6C-1EE72, U+1EE74-1EE77, U+1EE79-1EE7C, U+1EE7E, U+1EE80-1EE89, U+1EE8B-1EE9B, U+1EEA1-1EEA3, U+1EEA5-1EEA9, U+1EEAB-1EEBB, U+1EEF0-1EEF1;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Amiri';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3c0b51bd-0d3c-4b65-8026-2b416b28ffc9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Amiri';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"14ca6066-47e5-4e71-8448-65dd5c07fb5c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+ lbar { width: 0; height: 0; }\n    .vc-scroll::-webkit-scrollbar { width: 0; }\n    @keyframes vcAmb { 0% { transform: translate3d(0,0,0) scale(1); } 100% { transform: translate3d(2%,-2%,0) scale(1.1); } }\n    @keyframes vcRise { from { transform: translateY(12px); } to { transform: none; } }\n    @keyframes vcFade { from { opacity: 0; } to { opacity: 1; } }\n    @keyframes vcGlow { 0%,100% { box-shadow: 0 0 28px 4px rgba(216,183,122,.28), inset 0 6px 20px rgba(255,255,255,.5); } 50% { box-shadow: 0 0 50px 12px rgba(216,183,122,.5), inset 0 6px 20px rgba(255,255,255,.6); } }\n    @keyframes vcSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }\n    @keyframes vcPearl { 0%,100% { opacity: .85; } 50% { opacity: 1; } }\n    @keyframes vcSun { 0%,100% { opacity: .55; } 50% { opacity: .9; } }\n    .vc-step { animation: vcRise .5s ease both; }\n    .vc-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: linear-gradient(90deg, #A6B49B, #D8B77A, #C88E7A); outline: none; }\n    .vc-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #FCFAF4; border: 3px solid #C9A14E; box-shadow: 0 3px 10px rgba(184,149,79,.4); cursor: pointer; }\n    .vc-slider::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #FCFAF4; border: 3px solid #C9A14E; cursor: pointer; }\n    .vc-ar { font-family: 'Amiri', 'Scheherazade New', serif; direction: rtl; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 38px 16px 52px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Jost', system-ui, sans-serif; background: linear-gradient(180deg, #f3f5ef 0%, #f1ece1 55%, #ece2d2 100%);\">\n\n  <div style=\"position: fixed; inset: -12%; z-index: 0; pointer-events: none; background: radial-gradient(40% 34% at 26% 16%, rgba(138,151,137,.20), transparent 70%), radial-gradient(42% 38% at 80% 24%, rgba(216,183,122,.20), transparent 70%), radial-gradient(46% 42% at 56% 92%, rgba(166,180,155,.18), transparent 72%); animation: vcAmb 32s ease-in-out infinite alternate;\"><\u002Fdiv>\n  <div style=\"{{ ambTint }}\"><\u002Fdiv>\n\n  <div style=\"position: relative; z-index: 1; text-align: center; max-width: 360px;\">\n    <div style=\"font-size: 12.5px; color: #8C7C70; line-height: 1.5;\">Un cheminement doux du cœur — souffle, lumière, présence.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ════ PHONE SHELL ════ -->\n  <div style=\"position: relative; z-index: 1; width: 390px; height: 838px; border-radius: 46px; background: #F7F3EA; box-shadow: 0 40px 90px rgba(74,56,42,.26), 0 0 0 1px rgba(74,56,42,.09), inset 0 0 0 6px #efe7da; overflow: hidden; display: flex; flex-direction: column;\">\n\n    <!-- status bar -->\n    <div style=\"flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 12px 26px 6px; font-size: 13px; color: #3B2B23; font-weight: 600;\">\n      <span>9:41<\u002Fspan>\n      <span style=\"letter-spacing: .04em;\">▪▪▪ ▪<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- wordmark header -->\n    <div style=\"flex: 0 0 auto; text-align: center; padding: 6px 20px 12px; border-bottom: 1px solid #e8ddca;\">\n      <div style=\"font-size: 9.5px; letter-spacing: .34em; text-transform: uppercase; color: #9aa791; font-weight: 500;\">Cabinet psycho · spiritualité<\u002Fdiv>\n      <div style=\"font-family: 'Jost', sans-serif; font-weight: 300; font-size: 30px; letter-spacing: .04em; color: #C9A14E; margin-top: 4px; line-height: 1;\">Jannat al Qulûb<\u002Fdiv>\n      <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #8a9789; margin-top: 2px;\">Souffle &amp; Lumière<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- progress dots -->\n    <sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex: 0 0 auto; display: flex; gap: 6px; justify-content: center; padding: 12px 24px 4px;\">\n        <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"7\">\n          <div style=\"{{ d.style }}\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ════ SCROLL / STEP AREA ════ -->\n    <div class=\"vc-scroll\" style=\"flex: 1 1 auto; overflow-y: auto; overflow-x: hidden;\">\n\n      <!-- STEP 0 — INTENTION -->\n      <sc-if value=\"{{ is0 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"vc-step\" style=\"padding: 26px 24px 30px; text-align: center; min-height: 100%; display: flex; flex-direction: column; justify-content: center;\">\n        <div style=\"position: relative; width: 96px; height: 96px; margin: 0 auto 8px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #f3ecd9, #e6cf9c); display: flex; align-items: center; justify-content: center; animation: vcGlow 6s ease-in-out infinite;\">\n          <svg width=\"62\" height=\"62\" viewBox=\"0 0 100 100\" style=\"animation: vcSpin 60s linear infinite;\">\n            <rect x=\"27\" y=\"27\" width=\"46\" height=\"46\" rx=\"7\" fill=\"#D8B77A\" opacity=\"0.9\"><\u002Frect>\n            <rect x=\"27\" y=\"27\" width=\"46\" height=\"46\" rx=\"7\" fill=\"#C9A14E\" opacity=\"0.85\" transform=\"rotate(45 50 50)\"><\u002Frect>\n            <circle cx=\"50\" cy=\"50\" r=\"13\" fill=\"#FFFDF6\"><\u002Fcircle>\n            <circle cx=\"50\" cy=\"50\" r=\"13\" fill=\"none\" stroke=\"#E6CF9C\" stroke-width=\"2\"><\u002Fcircle>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h1 style=\"font-family: 'Jost', sans-serif; font-weight: 300; font-size: 30px; color: #677465; line-height: 1.18; margin: 14px 0 6px;\">Pose ton cœur, un instant.<\u002Fh1>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: #5E4D42; line-height: 1.5; margin: 0 6px 4px;\">Quelques minutes pour revenir à toi, et laisser la lumière entrer là où ça pèse.<\u002Fp>\n        <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: #B8954F; margin: 14px 0 2px;\">« Bismi-Llāh. »<\u002Fdiv>\n        <p style=\"font-size: 12.5px; color: #8C7C70; margin: 2px 0 22px;\">Pose une intention (niyya), même silencieuse.<\u002Fp>\n\n        <sc-if value=\"{{ hasSerie }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; align-items: center; justify-content: center; gap: 14px; background: #FCFAF4; border: 1px solid #ecdcbf; border-radius: 18px; padding: 13px 16px; margin: 0 auto 18px; max-width: 300px;\">\n            <div style=\"flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #E6CF9C, #D8B77A); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; color: #5E4D42;\">{{ serie }}<\u002Fdiv>\n            <div style=\"text-align: left;\"><div style=\"font-family: 'Cormorant Garamond', serif; font-size: 17px; color: #4A554A;\">{{ joursWord }} de présence à toi<\u002Fdiv><div style=\"font-size: 11.5px; color: #8C7C70;\">{{ namesCount }} Noms rencontrés · in shā' Allāh<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <button onclick=\"{{ next }}\" style=\"width: 100%; max-width: 320px; margin: 0 auto; background: linear-gradient(135deg, #8A9789, #677465); color: #FCFAF4; border: none; border-radius: 999px; padding: 16px; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 26px rgba(103,116,101,.3);\">Commencer la séance<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 1 — RESSENTI -->\n      <sc-if value=\"{{ is1 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"vc-step\" style=\"padding: 18px 22px 28px;\">\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 300; font-size: 27px; color: #677465; text-align: center; line-height: 1.18; margin: 6px 0 4px;\">Que ressens-tu en ce moment ?<\u002Fh2>\n        <div style=\"width: 40px; height: 2px; background: #D8B77A; border-radius: 2px; margin: 8px auto 14px;\"><\u002Fdiv>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-size: 17px; color: #5E4D42; text-align: center; line-height: 1.5; margin: 0 4px 6px;\">Pose-toi une seconde. Sans juger, sans corriger. Quel est l'état dominant dans ton cœur, là, maintenant ?<\u002Fp>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; color: #8C7C70; text-align: center; line-height: 1.5; margin: 0 8px 18px;\">Choisis ce qui résonne le plus. Si plusieurs te parlent, prends celui qui pèse le plus aujourd'hui.<\u002Fp>\n\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 11px;\">\n          <sc-for list=\"{{ etats }}\" as=\"e\" hint-placeholder-count=\"9\">\n            <button onclick=\"{{ e.onPick }}\" style-active=\"{{ tapDown }}\" style=\"{{ e.style }}\">\n              <span style=\"font-size: 26px; color: #B8954F; line-height: 1;\">{{ e.glyph }}<\u002Fspan>\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #4A554A; line-height: 1.2; text-align: center;\">{{ e.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 2 — INTENSITÉ AVANT -->\n      <sc-if value=\"{{ is2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"vc-step\" style=\"padding: 22px 24px 28px;\">\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 300; font-size: 27px; color: #677465; text-align: center; line-height: 1.18; margin: 6px 0 4px;\">À quel point cet état t'habite ?<\u002Fh2>\n        <div style=\"width: 40px; height: 2px; background: #D8B77A; border-radius: 2px; margin: 8px auto 16px;\"><\u002Fdiv>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-size: 17px; color: #5E4D42; text-align: center; line-height: 1.55; margin: 0 4px 28px;\">Sans dramatiser, sans minimiser. Une simple mesure pour observer le mouvement intérieur, avant et après ce cheminement.<\u002Fp>\n        <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #8a9789; margin-bottom: 12px;\">Intensité ressentie maintenant<\u002Fdiv>\n        <input class=\"vc-slider\" type=\"range\" min=\"0\" max=\"10\" step=\"1\" value=\"{{ before }}\" oninput=\"{{ setBefore }}\">\n        <div style=\"display: flex; justify-content: space-between; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12.5px; color: #8C7C70; margin-top: 8px;\"><span>0 — presque rien<\u002Fspan><span>10 — très intense<\u002Fspan><\u002Fdiv>\n        <div style=\"text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 34px; color: #B8954F; margin: 22px 0 6px;\">{{ before }} <span style=\"color: #c9bda8;\">/ 10<\u002Fspan><\u002Fdiv>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; color: #8C7C70; text-align: center; margin: 8px 0 24px;\">Tu pourras revenir mesurer en fin de séance, in shā' Allāh.<\u002Fp>\n        <div style=\"display: flex; gap: 12px;\">\n          <button onclick=\"{{ back }}\" style=\"{{ btnGhost }}\">← Retour<\u002Fbutton>\n          <button onclick=\"{{ next }}\" style=\"{{ btnGo }}\">Continuer<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 3 — SOUFFLE -->\n      <sc-if value=\"{{ is3 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"vc-step\" style=\"padding: 22px 24px 28px; text-align: center;\">\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 300; font-size: 27px; color: #677465; line-height: 1.18; margin: 6px 0 4px;\">Le souffle qui apaise<\u002Fh2>\n        <div style=\"width: 40px; height: 2px; background: #D8B77A; border-radius: 2px; margin: 8px auto 16px;\"><\u002Fdiv>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16.5px; color: #5E4D42; line-height: 1.55; margin: 0 6px 22px;\">{{ souffleText }}<\u002Fp>\n        <div style=\"position: relative; width: 188px; height: 188px; margin: 8px auto 14px;\">\n          <div style=\"position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #c2cdb6, #8A9789); display: flex; align-items: center; justify-content: center; transform: scale({{ breathScale }}); transition: transform {{ breathDur }} ease-in-out; box-shadow: 0 0 0 14px rgba(138,151,137,.10), 0 0 0 30px rgba(138,151,137,.05);\">\n            <span style=\"font-family: 'Jost', sans-serif; font-weight: 300; font-size: 19px; color: #FCFAF4; letter-spacing: .04em;\">{{ breathLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; color: #8C7C70; min-height: 22px; margin-bottom: 4px;\">{{ breathHint }}<\u002Fdiv>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13.5px; color: #b3a89b; margin: 4px 16px 20px;\">Pose une main sur ta poitrine. Sens l'air qui entre, et qui sort.<\u002Fp>\n        <div style=\"display: flex; gap: 12px;\">\n          <button onclick=\"{{ back }}\" style=\"{{ btnGhost }}\">← Retour<\u002Fbutton>\n          <button onclick=\"{{ next }}\" style=\"{{ btnGo }}\">{{ souffleCta }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 4 — ANCRAGE -->\n      <sc-if value=\"{{ is4 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"vc-step\" style=\"padding: 20px 22px 28px;\">\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 300; font-size: 27px; color: #677465; text-align: center; line-height: 1.18; margin: 6px 0 4px;\">L'ancrage prophétique<\u002Fh2>\n        <div style=\"width: 40px; height: 2px; background: #D8B77A; border-radius: 2px; margin: 8px auto 14px;\"><\u002Fdiv>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #8C7C70; text-align: center; line-height: 1.55; margin: 0 8px 16px;\">L'islam n'a pas ignoré ton état. Le Prophète ﷺ et la Révélation parlent à ce que tu vis.<\u002Fp>\n        <div style=\"background: #FCFAF4; border: 1px solid #efe6d8; border-radius: 22px; padding: 22px 18px; box-shadow: 0 6px 22px rgba(110,95,70,.08); text-align: center; margin-bottom: 14px;\">\n          <span style=\"display: inline-block; background: #e9ede6; color: #677465; border-radius: 999px; padding: 4px 14px; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600;\">Verset<\u002Fspan>\n          <div class=\"vc-ar\" style=\"font-size: 30px; color: #B8954F; line-height: 1.8; margin: 16px 0 6px;\">{{ cur.verseAr }}<\u002Fdiv>\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: #677465; margin-bottom: 8px;\">{{ cur.verseTranslit }}<\u002Fdiv>\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 17px; color: #4A554A; line-height: 1.5;\">« {{ cur.verseFr }} »<\u002Fdiv>\n          <div style=\"background: #f3f5ef; border-radius: 12px; padding: 9px 12px; margin-top: 14px;\"><div style=\"font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #8a9789; font-weight: 600;\">Source<\u002Fdiv><div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: #8C7C70; margin-top: 2px;\">{{ cur.verseSource }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-left: 3px solid #D8B77A; background: #fbf6ec; border-radius: 0 14px 14px 0; padding: 14px 16px; margin-bottom: 18px;\">\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #5E4D42; line-height: 1.55;\">{{ cur.comment }}<\u002Fdiv>\n          <div style=\"font-size: 11px; color: #B8954F; letter-spacing: .04em; margin-top: 8px;\">— {{ cur.commentSource }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 12px;\">\n          <button onclick=\"{{ back }}\" style=\"{{ btnGhost }}\">← Retour<\u002Fbutton>\n          <button onclick=\"{{ next }}\" style=\"{{ btnGo }}\">Continuer<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 5 — NOM D'ALLAH -->\n      <sc-if value=\"{{ is5 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"vc-step\" style=\"padding: 20px 22px 28px;\">\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 300; font-size: 27px; color: #677465; text-align: center; line-height: 1.18; margin: 6px 0 4px;\">Un Nom d'Allāh pour ton cœur<\u002Fh2>\n        <div style=\"width: 40px; height: 2px; background: #D8B77A; border-radius: 2px; margin: 8px auto 14px;\"><\u002Fdiv>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-size: 15.5px; color: #5E4D42; text-align: center; line-height: 1.55; margin: 0 6px 16px;\">Allāh ﷻ se fait connaître par Ses plus beaux Noms (<em>Al-Asmā' al-Ḥusnā<\u002Fem>). Chaque Nom est une porte. Voici celle qui correspond à ton état.<\u002Fp>\n        <div style=\"position: relative; background: linear-gradient(180deg, #fbf7ee, #f4ecd9); border: 1px solid #ecdcbf; border-radius: 24px; padding: 26px 20px; text-align: center; overflow: hidden; box-shadow: 0 8px 26px rgba(184,149,79,.14); margin-bottom: 14px;\">\n          <div style=\"position: absolute; top: -16px; right: -8px; font-size: 90px; color: rgba(216,183,122,.16);\">۞<\u002Fdiv>\n          <div class=\"vc-ar\" style=\"position: relative; font-size: 44px; color: #B8954F; line-height: 1.6;\">{{ cur.nameAr }}<\u002Fdiv>\n          <div style=\"position: relative; font-family: 'Jost', sans-serif; font-weight: 300; font-size: 24px; color: #677465; letter-spacing: .04em; margin: 6px 0 8px;\">{{ cur.nameTranslit }}<\u002Fdiv>\n          <div style=\"position: relative; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: #5E4D42; line-height: 1.5;\">{{ cur.nameMeaning }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1.5px dashed #d8c39a; border-radius: 18px; padding: 16px 18px; text-align: center; margin-bottom: 18px;\">\n          <div class=\"vc-ar\" style=\"font-size: 22px; color: #677465; line-height: 1.8; margin-bottom: 4px;\">{{ cur.invocAr }}<\u002Fdiv>\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; color: #B8954F;\">« {{ cur.invocTranslit }} »<\u002Fdiv>\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14.5px; color: #8C7C70; margin-top: 4px;\">{{ cur.invocFr }}<\u002Fdiv>\n          <div style=\"margin-top: 16px; padding-top: 15px; border-top: 1px solid #ecdcbf;\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; color: #8C7C70; min-height: 20px; margin-bottom: 14px;\">{{ dhikrMsg }}<\u002Fdiv>\n            <button onclick=\"{{ tapDhikr }}\" style-active=\"{{ tapDown }}\" style=\"{{ dhikrBtnStyle }}\">\n              <svg width=\"62\" height=\"62\" viewBox=\"0 0 100 100\" style=\"transform: scale({{ dhikrScale }}); transition: transform .2s ease;\">\n                <rect x=\"28\" y=\"28\" width=\"44\" height=\"44\" rx=\"7\" fill=\"#D8B77A\" opacity=\"0.92\"><\u002Frect>\n                <rect x=\"28\" y=\"28\" width=\"44\" height=\"44\" rx=\"7\" fill=\"#C9A14E\" opacity=\"0.85\" transform=\"rotate(45 50 50)\"><\u002Frect>\n                <circle cx=\"50\" cy=\"50\" r=\"12\" fill=\"#FFFDF6\"><\u002Fcircle>\n              <\u002Fsvg>\n            <\u002Fbutton>\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 30px; color: #B8954F; margin-top: 12px;\">{{ dhikr }} <span style=\"color: #c9bda8;\"><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 12px;\">\n          <button onclick=\"{{ back }}\" style=\"{{ btnGhost }}\">← Retour<\u002Fbutton>\n          <button onclick=\"{{ next }}\" style=\"{{ btnGo }}\">Continuer<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 6 — PAS CONCRET -->\n      <sc-if value=\"{{ is6 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"vc-step\" style=\"padding: 20px 22px 28px;\">\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 300; font-size: 27px; color: #677465; text-align: center; line-height: 1.18; margin: 6px 0 4px;\">Un pas concret<\u002Fh2>\n        <div style=\"width: 40px; height: 2px; background: #D8B77A; border-radius: 2px; margin: 8px auto 14px;\"><\u002Fdiv>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #5E4D42; text-align: center; line-height: 1.55; margin: 0 6px 18px;\">La lumière se vit dans un geste. Choisis-en un seul, le plus doux pour toi maintenant.<\u002Fp>\n        <sc-for list=\"{{ pasList }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <button onclick=\"{{ p.onPick }}\" style-active=\"{{ tapDown }}\" style=\"{{ p.style }}\">\n            <span style=\"flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: #e9ede6; color: #677465; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 700;\">{{ p.n }}<\u002Fspan>\n            <span style=\"flex: 1; font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #4A554A; line-height: 1.4; text-align: left;\">{{ p.text }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"display: flex; gap: 12px; margin-top: 8px;\">\n          <button onclick=\"{{ back }}\" style=\"{{ btnGhost }}\">← Retour<\u002Fbutton>\n          <button onclick=\"{{ next }}\" style=\"{{ btnGo }}\">Vers la clôture<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- STEP 7 — CLÔTURE -->\n      <sc-if value=\"{{ is7 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"vc-step\" style=\"padding: 22px 24px 30px; text-align: center;\">\n        <div style=\"width: 70px; height: 70px; margin: 4px auto 6px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #f3ecd9, #e6cf9c); display: flex; align-items: center; justify-content: center; animation: vcGlow 6s ease-in-out infinite;\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 100 100\"><rect x=\"29\" y=\"29\" width=\"42\" height=\"42\" rx=\"6\" fill=\"#D8B77A\" opacity=\"0.9\"><\u002Frect><rect x=\"29\" y=\"29\" width=\"42\" height=\"42\" rx=\"6\" fill=\"#C9A14E\" opacity=\"0.85\" transform=\"rotate(45 50 50)\"><\u002Frect><circle cx=\"50\" cy=\"50\" r=\"11\" fill=\"#FFFDF6\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n        <h2 style=\"font-family: 'Jost', sans-serif; font-weight: 300; font-size: 27px; color: #677465; line-height: 1.18; margin: 8px 0 4px;\">La sakīna se dépose.<\u002Fh2>\n        <div style=\"width: 40px; height: 2px; background: #D8B77A; border-radius: 2px; margin: 8px auto 16px;\"><\u002Fdiv>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #5E4D42; line-height: 1.55; margin: 0 6px 18px;\">Reviens mesurer, doucement. Pas pour juger — pour observer le chemin parcouru.<\u002Fp>\n        <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #8a9789; margin-bottom: 10px;\">Intensité maintenant<\u002Fdiv>\n        <input class=\"vc-slider\" type=\"range\" min=\"0\" max=\"10\" step=\"1\" value=\"{{ after }}\" oninput=\"{{ setAfter }}\">\n        <div style=\"text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 30px; color: #B8954F; margin: 16px 0 4px;\">{{ after }} <span style=\"color: #c9bda8;\">/ 10<\u002Fspan><\u002Fdiv>\n        <div style=\"background: #FCFAF4; border: 1px solid #efe6d8; border-radius: 18px; padding: 14px 16px; margin: 12px 0 16px; box-shadow: 0 5px 18px rgba(110,95,70,.07);\">\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 17px; color: #4A554A; line-height: 1.5;\">{{ deltaMsg }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: linear-gradient(180deg, #fbf6ec, #f5ecd9); border: 1px solid #ecdcbf; border-radius: 18px; padding: 16px 18px; margin-bottom: 16px;\">\n          <div class=\"vc-ar\" style=\"font-size: 22px; color: #B8954F; line-height: 1.8;\">{{ cur.invocAr }}<\u002Fdiv>\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #5E4D42; margin-top: 4px;\">{{ cur.invocFr }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #FCFAF4; border: 1px solid #efe6d8; border-radius: 18px; padding: 16px; margin-bottom: 18px;\">\n          <div style=\"display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px;\">\n            <div style=\"flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #E6CF9C, #D8B77A); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; color: #5E4D42;\">{{ serie }}<\u002Fdiv>\n            <div style=\"text-align: left;\"><div style=\"font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #4A554A;\">{{ joursWord }} de présence à toi<\u002Fdiv><div style=\"font-size: 11px; color: #8C7C70;\">Qu'Allāh facilite chaque cheminement.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #9aa791; font-weight: 600; margin: 6px 0 8px;\">Les Noms rencontrés<\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;\">\n            <sc-for list=\"{{ namesCollected }}\" as=\"n\" hint-placeholder-count=\"3\">\n              <span style=\"background: #f3f5ef; border: 1px solid #dde3d8; border-radius: 999px; padding: 5px 12px; font-family: 'Cormorant Garamond', serif; font-size: 14px; color: #677465;\">{{ n }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <button onclick=\"{{ restart }}\" style=\"width: 100%; background: linear-gradient(135deg, #8A9789, #677465); color: #FCFAF4; border: none; border-radius: 999px; padding: 15px; font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 24px rgba(103,116,101,.3);\">Terminer en paix<\u002Fbutton>\n        <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: #b3a89b; margin: 14px 8px 0; line-height: 1.5;\">Jannat al Qulûb · accompagnement psycho-spirituel &amp; tradition islamique. Ne remplace ni un diagnostic, ni un suivi médical.<\u002Fp>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position: relative; z-index: 1; font-size: 12px; color: #8C7C70; text-align: center; max-width: 340px; line-height: 1.5;\">Prototype interactif · parcours une séance complète, du ressenti à la sakīna.<\u002Fdiv>\n\n  \n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 440, &quot;height&quot;: 940}}\">\nclass Component extends DCLogic {\n  state = { step: 0, etat: null, before: 5, after: 5, pas: null, breathScale: 0.62, breathLabel: 'Prêt(e) ?', breathHint: '', breathDur: '0.6s', breathDone: false, serie: null, names: [], justName: null, dhikr: 0, dhikrScale: 1 };\n\n  ETATS = [\n    { id: 'stress', label: 'Stress, surcharge', glyph: '◉',\n      souffleText: \"Le stress raccourcit le souffle. On va l\\u2019allonger doucement. Inspire 4 secondes, expire 6. L\\u2019expiration longue dit à ton corps : tu peux te poser.\",\n      verseAr: \"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ\", verseTranslit: \"Alā bi-dhikri-Llāhi taṭma'innu al-qulūb.\", verseFr: \"N\\u2019est-ce point par le rappel d\\u2019Allāh que les cœurs s\\u2019apaisent ?\", verseSource: \"Sourate Ar-Ra\\u2019d, v. 28 (sens du verset)\",\n      comment: \"Ibn al-Qayyim, dans Madārij as-Sālikīn, explique que le dhikr est le remède du cœur agité : il défait les nœuds que l\\u2019inquiétude resserre.\", commentSource: \"Commentaire savant\",\n      nameAr: \"السَّلَامُ\", nameTranslit: \"As-Salām\", nameMeaning: \"La Paix — Celui qui est la Source de toute paix, exempt de tout trouble.\",\n      invocAr: \"يَا سَلَامُ، سَلِّمْ قَلْبِي\", invocTranslit: \"Yā Salām, sallim qalbī.\", invocFr: \"Ô Source de Paix, pacifie mon cœur.\",\n      pas: [\"Pose une seule chose, repousse le reste à demain.\", \"Fais un dhikr lent : « SubḥānAllāh » dix fois.\", \"Bois un verre d\\u2019eau, lentement, en pleine conscience.\"] },\n    { id: 'angoisse', label: 'Angoisse, peur', glyph: '✦',\n      souffleText: \"La peur emballe le souffle. Ralentis-le : inspire 4, expire 6. À chaque expiration, dépose un peu de ce qui t\\u2019effraie.\",\n      verseAr: \"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ\", verseTranslit: \"Ḥasbunā-Llāhu wa ni\\u2019ma al-wakīl.\", verseFr: \"Allāh nous suffit, et quel excellent garant !\", verseSource: \"Sourate Āl \\u2018Imrān, v. 173 (sens du verset)\",\n      comment: \"Cette parole fut celle d\\u2019Ibrāhīm dans le feu, et des croyants face au danger : remettre l\\u2019issue à Allāh désamorce la peur.\", commentSource: \"Tradition prophétique\",\n      nameAr: \"الْمُؤْمِنُ\", nameTranslit: \"Al-Mu'min\", nameMeaning: \"Celui qui rassure — qui accorde la sécurité et apaise les cœurs effrayés.\",\n      invocAr: \"يَا مُؤْمِنُ، آمِنْ رَوْعَتِي\", invocTranslit: \"Yā Mu'min, āmin raw\\u2019atī.\", invocFr: \"Ô Toi qui rassures, apaise mon effroi.\",\n      pas: [\"Nomme la peur à voix basse : « j\\u2019ai peur de… ».\", \"Reviens au présent : 5 choses que tu vois.\", \"Confie l\\u2019issue : « Ḥasbunā-Llāh », trois fois.\"] },\n    { id: 'tristesse', label: 'Tristesse, cœur lourd', glyph: '☾',\n      souffleText: \"La tristesse alourdit la poitrine. Respire amplement, sans forcer : inspire 4, expire 6. Laisse l\\u2019air faire de la place.\",\n      verseAr: \"وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ\", verseTranslit: \"Wa lā tay'asū min rawḥi-Llāh.\", verseFr: \"Ne désespérez pas de la miséricorde d\\u2019Allāh.\", verseSource: \"Sourate Yūsuf, v. 87 (sens du verset)\",\n      comment: \"La tristesse n\\u2019est pas un péché ; le Prophète ﷺ lui-même a connu « l\\u2019année de la tristesse ». Mais le cœur du croyant garde un fil d\\u2019espérance.\", commentSource: \"Sīra & commentaire\",\n      nameAr: \"الْوَدُودُ\", nameTranslit: \"Al-Wadūd\", nameMeaning: \"Le Tout-Affectueux — qui aime Ses serviteurs et se fait aimer d\\u2019eux.\",\n      invocAr: \"يَا وَدُودُ، ارْحَمْ قَلْبِي\", invocTranslit: \"Yā Wadūd, irḥam qalbī.\", invocFr: \"Ô Toi le Tout-Affectueux, fais miséricorde à mon cœur.\",\n      pas: [\"Autorise une larme, sans la juger.\", \"Écris une ligne de ce qui pèse.\", \"Tends un lien : un message à une personne sûre.\"] },\n    { id: 'fatigue', label: 'Fatigue, épuisement', glyph: '☁',\n      souffleText: \"Quand le corps est vidé, le souffle aussi. Ne force rien : inspire 4, expire 6, comme on se laisse porter.\",\n      verseAr: \"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ\", verseTranslit: \"Allāhu lā ilāha illā huwa al-Ḥayyu al-Qayyūm.\", verseFr: \"Allāh — point de divinité à part Lui, le Vivant, Celui qui subsiste par Lui-même.\", verseSource: \"Sourate Al-Baqara, v. 255 (Āyat al-Kursī)\",\n      comment: \"S\\u2019appuyer sur Al-Qayyūm, c\\u2019est cesser de tout porter seule : Lui fait subsister toute chose, y compris quand tu n\\u2019en peux plus.\", commentSource: \"Commentaire savant\",\n      nameAr: \"الْقَيُّومُ\", nameTranslit: \"Al-Qayyūm\", nameMeaning: \"Celui qui subsiste par Lui-même et fait subsister toute chose.\",\n      invocAr: \"يَا قَيُّومُ، بِكَ أَسْتَغِيثُ\", invocTranslit: \"Yā Qayyūm, bika astaghīth.\", invocFr: \"Ô Toi qui fais subsister, c\\u2019est à Toi que je demande secours.\",\n      pas: [\"Accorde-toi un vrai repos, sans culpabilité.\", \"Réduis ta journée à une seule chose.\", \"Confie ta faiblesse : « Yā Qayyūm ».\"] },\n    { id: 'colere', label: 'Colère, irritation', glyph: '✺',\n      souffleText: \"La colère est un feu : le souffle l\\u2019apaise. Inspire 4, expire 6, lentement. Si tu es debout, assieds-toi ; si tu es assise, allonge-toi.\",\n      verseAr: \"وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ\", verseTranslit: \"Wa-l-kāẓimīna al-ghayẓa wa-l-\\u2018āfīna \\u2018ani-n-nās.\", verseFr: \"…ceux qui contiennent leur colère et pardonnent aux gens.\", verseSource: \"Sourate Āl \\u2018Imrān, v. 134 (sens du verset)\",\n      comment: \"Le Prophète ﷺ a dit : « Le fort n\\u2019est pas celui qui terrasse les autres, mais celui qui se maîtrise dans la colère. »\", commentSource: \"Hadith (Bukhārī & Muslim)\",\n      nameAr: \"الْحَلِيمُ\", nameTranslit: \"Al-Ḥalīm\", nameMeaning: \"Le Plein de mansuétude — qui ne se précipite pas, et couvre de douceur.\",\n      invocAr: \"يَا حَلِيمُ، حَلِّمْ نَفْسِي\", invocTranslit: \"Yā Ḥalīm, ḥallim nafsī.\", invocFr: \"Ô Toi le Plein de douceur, adoucis mon âme.\",\n      pas: [\"Dis « A\\u2019ūdhu billāh » et bois de l\\u2019eau.\", \"Change de position ou de pièce un instant.\", \"Diffère ta réponse : rien d\\u2019urgent à dire maintenant.\"] },\n    { id: 'waswas', label: 'Waswās, pensées intrusives', glyph: '△',\n      souffleText: \"Le waswās s\\u2019accroche au souffle saccadé. Reviens à un rythme lent : inspire 4, expire 6. Tu n\\u2019as pas à discuter avec ces pensées.\",\n      verseAr: \"قُلْ أَعُوذُ بِرَبِّ النَّاسِ\", verseTranslit: \"Qul a\\u2019ūdhu bi-rabbi-n-nās.\", verseFr: \"Dis : je cherche refuge auprès du Seigneur des hommes.\", verseSource: \"Sourate An-Nās, v. 1 (sens du verset)\",\n      comment: \"Face au waswās, on n\\u2019argumente pas : on se réfugie en Allāh et on passe. Lui prêter attention le nourrit ; s\\u2019en détourner l\\u2019affaiblit.\", commentSource: \"Commentaire savant\",\n      nameAr: \"الْحَفِيظُ\", nameTranslit: \"Al-Ḥafīẓ\", nameMeaning: \"Le Gardien — qui préserve et protège ce qu\\u2019Il a en charge.\",\n      invocAr: \"يَا حَفِيظُ، احْفَظْنِي\", invocTranslit: \"Yā Ḥafīẓ, iḥfaẓnī.\", invocFr: \"Ô Gardien, protège-moi.\",\n      pas: [\"Dis « A\\u2019ūdhu billāh » et n\\u2019analyse pas la pensée.\", \"Ramène ton attention à un geste simple.\", \"Récite Al-Mu\\u2019awwidhatān (Al-Falaq & An-Nās).\"] },\n    { id: 'culpabilite', label: 'Culpabilité, honte', glyph: '✿',\n      souffleText: \"La honte voûte le corps et bloque le souffle. Redresse-toi doucement : inspire 4, expire 6. Tu mérites de respirer pleinement.\",\n      verseAr: \"لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ\", verseTranslit: \"Lā taqnaṭū min raḥmati-Llāh.\", verseFr: \"Ne désespérez pas de la miséricorde d\\u2019Allāh.\", verseSource: \"Sourate Az-Zumar, v. 53 (sens du verset)\",\n      comment: \"Le repentir (tawba) n\\u2019est pas une humiliation, c\\u2019est un retour aimé d\\u2019Allāh : « Allāh aime ceux qui se repentent. » La porte reste ouverte.\", commentSource: \"Coran 2:222 & commentaire\",\n      nameAr: \"التَّوَّابُ\", nameTranslit: \"At-Tawwāb\", nameMeaning: \"Celui qui accueille le repentir — encore et encore, sans se lasser.\",\n      invocAr: \"يَا تَوَّابُ، تُبْ عَلَيَّ\", invocTranslit: \"Yā Tawwāb, tub \\u2018alayya.\", invocFr: \"Ô Toi qui accueilles le repentir, accepte mon retour.\",\n      pas: [\"Distingue le fait du jugement sur toi.\", \"Demande pardon une fois, sincèrement, puis avance.\", \"Pose un geste de bien, même minuscule.\"] },\n    { id: 'vide', label: 'Vide, perte de sens', glyph: '◌',\n      souffleText: \"Le vide assèche l\\u2019élan. Le souffle rallume doucement : inspire 4, expire 6. Sens que tu es vivante, là, maintenant.\",\n      verseAr: \"اللَّهُ نُورُ السَّمَاوَاتِ وَالْأَرْضِ\", verseTranslit: \"Allāhu nūru-s-samāwāti wa-l-arḍ.\", verseFr: \"Allāh est la Lumière des cieux et de la terre.\", verseSource: \"Sourate An-Nūr, v. 35 (sens du verset)\",\n      comment: \"Le vide n\\u2019est pas l\\u2019absence de sens, mais un cœur en attente de lumière. Un seul rai de dhikr suffit à rallumer la lampe.\", commentSource: \"Commentaire savant\",\n      nameAr: \"النُّورُ\", nameTranslit: \"An-Nūr\", nameMeaning: \"La Lumière — qui éclaire les cieux, la terre, et les cœurs.\",\n      invocAr: \"يَا نُورُ، نَوِّرْ قَلْبِي\", invocTranslit: \"Yā Nūr, nawwir qalbī.\", invocFr: \"Ô Lumière, illumine mon cœur.\",\n      pas: [\"Fais une seule petite chose utile, sans but de rendement.\", \"Sors prendre l\\u2019air et la lumière un instant.\", \"Lis un verset, lentement, et laisse-le résonner.\"] },\n    { id: 'gratitude', label: 'Gratitude, ouverture', glyph: '❀',\n      souffleText: \"La gratitude ouvre la poitrine. Respire largement : inspire 4, expire 6, en savourant. Ce souffle aussi est un bienfait.\",\n      verseAr: \"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ\", verseTranslit: \"La'in shakartum la-azīdannakum.\", verseFr: \"Si vous êtes reconnaissants, Je vous donnerai davantage.\", verseSource: \"Sourate Ibrāhīm, v. 7 (sens du verset)\",\n      comment: \"La gratitude (shukr) n\\u2019est pas seulement un sentiment : c\\u2019est une porte qui appelle l\\u2019abondance et stabilise le cœur dans le bien.\", commentSource: \"Commentaire savant\",\n      nameAr: \"الشَّكُورُ\", nameTranslit: \"Ash-Shakūr\", nameMeaning: \"Le Très-Reconnaissant — qui récompense largement le moindre bien.\",\n      invocAr: \"يَا شَكُورُ، اجْعَلْنِي مِنَ الشَّاكِرِينَ\", invocTranslit: \"Yā Shakūr, ij\\u2018alnī mina-sh-shākirīn.\", invocFr: \"Ô Toi le Reconnaissant, compte-moi parmi les reconnaissants.\",\n      pas: [\"Nomme trois bienfaits d\\u2019aujourd\\u2019hui.\", \"Dis « al-ḥamdu lillāh » en conscience.\", \"Offre un bien à quelqu\\u2019un, en remerciement.\"] },\n  ];\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem('voiechifa.v1');\n      if (raw) { const d = JSON.parse(raw); this.setState({ serie: d.serie ?? 0, names: Array.isArray(d.names) ? d.names : [] }); }\n      else { this.setState({ serie: 0, names: [] }); }\n    } catch (e) { this.setState({ serie: 0, names: [] }); }\n  }\n  componentWillUnmount() { this._stopBreath(); }\n\n  todayStr() { const n = new Date(); return n.getFullYear() + '-' + (n.getMonth() + 1) + '-' + n.getDate(); }\n  cur() { return this.ETATS.find(e => e.id === this.state.etat) || this.ETATS[0]; }\n\n  go = (step) => () => { this.setState({ step }); if (step === 3) this._startBreath(); else this._stopBreath(); };\n  next = () => { const s = this.state.step; const ns = s + 1; this.setState({ step: ns }); if (ns === 3) this._startBreath(); else this._stopBreath(); if (ns === 7) this._finish(); };\n  back = () => { const ns = Math.max(0, this.state.step - 1); this.setState({ step: ns }); if (ns === 3) this._startBreath(); else this._stopBreath(); };\n  pick = (id) => () => this.setState({ step: 2, etat: id, before: 5, after: 5, dhikr: 0, dhikrScale: 1 });\n  pickPas = (i) => () => this.setState({ pas: i });\n  setBefore = (e) => this.setState({ before: +e.target.value });\n  setAfter = (e) => this.setState({ after: +e.target.value });\n  restart = () => { this._stopBreath(); this.setState({ step: 0, etat: null, before: 5, after: 5, pas: null, dhikr: 0 }); };\n\n  tapDhikr = () => {\n    const n = ((this.state.dhikr || 0) + 1);\n    this.setState({ dhikr: n, dhikrScale: 1.14 });\n    clearTimeout(this._dt); this._dt = setTimeout(() => this.setState({ dhikrScale: 1 }), 200);\n  };\n\n  _startBreath() {\n    this._stopBreath();\n    let phase = 0; // 0 inspire(4s), 1 expire(6s)\n    const tick = () => {\n      if (phase === 0) { this.setState({ breathScale: 1, breathDur: '4s', breathLabel: 'Inspire', breathHint: '4 secondes…' }); phase = 1; this._bt = setTimeout(tick, 4200); }\n      else { this.setState({ breathScale: 0.62, breathDur: '6s', breathLabel: 'Expire', breathHint: '6 secondes…' }); phase = 0; this._bt = setTimeout(tick, 6200); }\n    };\n    this.setState({ breathLabel: 'Inspire', breathHint: 'On commence, en douceur…' });\n    this._bt = setTimeout(tick, 400);\n    this._bdone = setTimeout(() => this.setState({ breathDone: true }), 20000);\n  }\n  _stopBreath() { if (this._bt) clearTimeout(this._bt); if (this._bdone) clearTimeout(this._bdone); }\n\n  _finish() {\n    const c = this.cur();\n    const today = this.todayStr();\n    try {\n      const raw = localStorage.getItem('voiechifa.v1');\n      const d = raw ? JSON.parse(raw) : {};\n      let serie = d.serie ?? 0;\n      if (d.lastDate !== today) serie = serie + 1;\n      const names = Array.isArray(d.names) ? d.names.slice() : [];\n      if (!names.includes(c.nameTranslit)) names.push(c.nameTranslit);\n      const journal = Array.isArray(d.journal) ? d.journal.slice() : [];\n      journal.unshift({ date: today, etat: c.id, before: this.state.before, after: this.state.after });\n      localStorage.setItem('voiechifa.v1', JSON.stringify({ serie, lastDate: today, names, journal: journal.slice(0, 60) }));\n      this.setState({ serie, names });\n    } catch (e) {}\n  }\n\n  renderVals() {\n    const st = this.state;\n    const c = this.cur();\n    const btnGo = { flex: 1, background: 'linear-gradient(135deg, #8A9789, #677465)', color: '#FCFAF4', border: 'none', borderRadius: '999px', padding: '15px', fontFamily: \"'Jost', sans-serif\", fontSize: '13px', fontWeight: 600, letterSpacing: '.12em', textTransform: 'uppercase', cursor: 'pointer', boxShadow: '0 8px 22px rgba(103,116,101,.3)' };\n    const btnGhost = { flex: '0 0 auto', background: 'transparent', color: '#8a9789', border: 'none', fontFamily: \"'Jost', sans-serif\", fontSize: '13px', fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase', cursor: 'pointer', padding: '15px 6px' };\n\n    const etats = this.ETATS.map(e => ({\n      label: e.label, glyph: e.glyph, onPick: this.pick(e.id),\n      style: { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '10px', minHeight: '108px', background: '#FCFAF4', border: st.etat === e.id ? '1.5px solid #C9A14E' : '1px solid #e8ddca', borderRadius: '18px', padding: '16px 10px', cursor: 'pointer', fontFamily: \"'Jost', sans-serif\", boxShadow: st.etat === e.id ? '0 6px 18px rgba(201,161,78,.22)' : '0 4px 14px rgba(110,95,70,.06)' },\n    }));\n\n    const pasList = (c.pas || []).map((text, i) => ({\n      n: i + 1, text, onPick: this.pickPas(i),\n      style: { display: 'flex', alignItems: 'center', gap: '13px', width: '100%', textAlign: 'left', background: st.pas === i ? '#eef1ea' : '#FCFAF4', border: st.pas === i ? '1.5px solid #8a9789' : '1px solid #efe6d8', borderRadius: '16px', padding: '14px 15px', marginBottom: '10px', cursor: 'pointer', fontFamily: \"'Jost', sans-serif\", boxShadow: '0 4px 14px rgba(110,95,70,.05)' },\n    }));\n\n    // progress dots (steps 1..7)\n    const dots = [1, 2, 3, 4, 5, 6, 7].map(i => ({\n      style: { flex: 1, maxWidth: '34px', height: '4px', borderRadius: '999px', background: i < st.step ? '#8a9789' : i === st.step ? '#C9A14E' : '#e3dccd', transition: 'background .3s' },\n    }));\n\n    const delta = st.before - st.after;\n    let deltaMsg;\n    if (delta >= 3) deltaMsg = `Ton cœur s\\u2019est allégé de ${delta} points. La sakīna a fait son chemin — al-ḥamdu lillāh.`;\n    else if (delta >= 1) deltaMsg = \"Un léger apaisement s\\u2019est posé. C\\u2019est déjà un pas, et il compte.\";\n    else if (delta === 0) deltaMsg = \"L\\u2019intensité est stable. Parfois, simplement traverser sans aggraver, c\\u2019est l\\u2019essentiel.\";\n    else deltaMsg = \"Si la vague est montée, ce n\\u2019est pas un échec : tu as osé regarder. Sois douce, et reviens quand tu veux.\";\n\n    const souffleCta = st.breathDone ? \"Je me sens prêt(e)\" : \"Continuer\";\n\n    const dProg = Math.min(1, (st.dhikr || 0) / 7);\n    const tints = { stress: '#C88E7A', angoisse: '#a98ba0', tristesse: '#9aacb0', fatigue: '#B9ADA0', colere: '#cc8f6f', waswas: '#8A9789', culpabilite: '#d8a892', vide: '#c9b07a', gratitude: '#D8B77A' };\n    const tcol = tints[c.id] || '#D8B77A';\n    const ambTint = { position: 'fixed', inset: '-12%', zIndex: 0, pointerEvents: 'none', opacity: st.etat ? 0.5 : 0, transition: 'opacity 1.4s ease', background: `radial-gradient(42% 38% at 28% 18%, ${tcol}, transparent 68%), radial-gradient(44% 40% at 78% 82%, ${tcol}, transparent 70%)` };\n    const dhikrBtnStyle = { position: 'relative', width: '130px', height: '130px', borderRadius: '50%', border: 'none', cursor: 'pointer', margin: '0 auto', background: `radial-gradient(circle at 50% 40%, #FFFDF6, #F4E7BE ${40 + dProg * 18}%, #E6CF9C)`, boxShadow: `0 0 ${12 + dProg * 44}px ${3 + dProg * 13}px rgba(216,183,122,${0.2 + dProg * 0.45}), inset 0 4px 14px rgba(255,255,255,.6)`, display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'box-shadow .45s ease, background .45s ease' };\n    const dhikrMsg = (st.dhikr >= 3) ? \"✦ Qu\\u2019il s\\u2019imprime dans ton cœur.\" : (st.dhikr > 0 ? \"…doucement, encore.\" : \"Touche l\\u2019étoile, autant de fois que ton cœur en ressent le besoin.\");\n    const tapDown = { transform: 'scale(0.97)' };\n\n    return {\n      is0: st.step === 0, is1: st.step === 1, is2: st.step === 2, is3: st.step === 3, is4: st.step === 4, is5: st.step === 5, is6: st.step === 6, is7: st.step === 7,\n      showProgress: st.step >= 1,\n      dots, etats, pasList, cur: c,\n      before: st.before, after: st.after,\n      setBefore: this.setBefore, setAfter: this.setAfter,\n      next: this.next, back: this.back, restart: this.restart,\n      btnGo, btnGhost,\n      souffleText: c.souffleText, souffleCta,\n      breathScale: st.breathScale, breathDur: st.breathDur, breathLabel: st.breathLabel, breathHint: st.breathHint,\n      deltaMsg,\n      dhikr: st.dhikr || 0, dhikrScale: st.dhikrScale || 1, dhikrBtnStyle, dhikrMsg, ambTint, tapDown, tapDhikr: this.tapDhikr,\n      serie: st.serie == null ? 0 : st.serie, joursWord: (st.serie || 0) > 1 ? 'jours' : 'jour', namesCount: (st.names || []).length, hasSerie: (st.serie || 0) > 0,\n      namesCollected: (st.names || []).length ? st.names : [c.nameTranslit],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
