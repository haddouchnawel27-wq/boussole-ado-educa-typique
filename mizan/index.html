<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mîzân — outil d'auto-compréhension pour femmes entrepreneures : check-in du jour, tendances, recommandations, journal des pensées (TCC). 100% local et privé." />
  <meta name="theme-color" content="#3a7d6e" />
  <title>Mîzân — Retrouver l'équilibre, devenir alignée</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <header class="topbar">
    <a href="#/accueil" class="brand" aria-label="Accueil Mîzân">
      <span class="brand-logo" aria-hidden="true">⚖️</span>
      <span class="brand-name">Mîzân</span>
    </a>
    <button id="btn-crise" class="btn crise mini" type="button">🆘 Crise</button>
  </header>

  <nav id="onglets" class="onglets" aria-label="Navigation principale"></nav>

  <main id="contenu" class="content" tabindex="-1">
    <section id="vue" class="vue" aria-live="polite"></section>
    <footer class="pied">
      <p>🔒 Tes données restent sur cet appareil. Aucun compte, aucun serveur.</p>
      <p class="disclaimer">Outil de soutien à la compréhension de soi — ne remplace ni un diagnostic, ni un suivi médical ou psychologique.</p>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal-root"></div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById("btn-crise").addEventListener("click", function () { Mizan.crise(); });
    Mizan.start();
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
